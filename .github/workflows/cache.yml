name: Cache contracts

on:
  # 历史专项保留手动复测入口，日常检查由 CI 工作流承担。
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cache-contracts-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  cache:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install pinned Rust tooling
        run: |
          bash tools/ci/install-rustup.sh
          export PATH="$HOME/.cargo/bin:$PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          toolchain="$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)"
          test -n "$toolchain"
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt --component clippy
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: cache-contracts
          cache-on-failure: true
      - name: Check cache formatting
        run: cargo fmt -p af-cache -- --check
      - name: Lint cache contracts
        run: cargo clippy -p af-cache --all-targets --locked -- -D warnings
      - name: Test cache contracts
        run: cargo test -p af-cache --locked
      - name: Test shared Redis admission
        run: bash tools/ci/run-cache-redis-test.sh --cache-only
