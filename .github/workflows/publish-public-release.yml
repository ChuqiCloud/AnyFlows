name: Publish public release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: public-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'ChuqiCloud/AnyFlows' && github.server_url == 'https://github.com'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
      CARGO_BUILD_JOBS: "2"
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Validate release tag
        env:
          RELEASE_MASTER_REF: refs/remotes/origin/main
        run: bash tools/ci/verify-release-tag.sh "$GITHUB_REF_NAME" "$GITHUB_SHA"

      - name: Install Rust toolchain
        run: |
          bash tools/ci/install-rustup.sh
          export PATH="$HOME/.cargo/bin:$PATH"
          toolchain="$(sed -n 's/^channel = \"\(.*\)\"/\1/p' rust-toolchain.toml)"
          test -n "$toolchain"
          rustup toolchain install "$toolchain" --profile minimal
          rustc --version --verbose

      - name: Cache Rust release artifacts
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: public-release

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0

      - name: Install frontend dependencies
        run: |
          corepack enable
          corepack pnpm@10.33.0 --dir web install --frozen-lockfile
          corepack pnpm@10.33.0 --dir web-next install --frozen-lockfile

      - name: Build embedded frontends
        run: |
          corepack pnpm@10.33.0 --dir web build
          corepack pnpm@10.33.0 --dir web-next build

      - name: Build release binary
        run: |
          export AF_BUILD_COMMIT="$(git rev-parse HEAD)"
          export AF_BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          cargo build --release --locked --package af-server

      - name: Package and verify Linux amd64 archive
        run: |
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          bash tools/ci/package-release.sh "$GITHUB_REF_NAME" amd64
          cp "release/anyflows-${GITHUB_REF_NAME}-linux-amd64.tar.gz.sha256" release/SHA256SUMS
          (cd release && sha256sum --check --strict SHA256SUMS)

      - name: Prepare release notes
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          awk -v header="## $version" '
            $0 == header || index($0, header " - ") == 1 { found = 1; print; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release/CHANGELOG.md
          test -s release/CHANGELOG.md
          {
            printf '# AnyFlows %s\n\n' "$GITHUB_REF_NAME"
            printf 'AnyFlows 社区开放版，包含 Linux amd64 二进制与 Classic、Next 两套内置前端。\n\n'
            cat release/CHANGELOG.md
            printf '\n## SHA-256\n\n```text\n'
            cat release/SHA256SUMS
            printf '```\n'
          } > release/RELEASE_NOTES.md

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          title="AnyFlows $tag"
          if gh release view "$tag" --json isDraft > release/existing-release.json 2>/dev/null; then
            jq -e '.isDraft == true' release/existing-release.json >/dev/null || {
              echo 'This version has already been published; create a new version instead.' >&2
              exit 1
            }
          else
            gh release create "$tag" \
              --draft \
              --verify-tag \
              --title "$title" \
              --notes-file release/RELEASE_NOTES.md
          fi
          gh release upload "$tag" \
            "release/anyflows-${tag}-linux-amd64.tar.gz" \
            "release/anyflows-${tag}-linux-amd64.tar.gz.sha256" \
            "release/SHA256SUMS" \
            --clobber
          if [[ "$tag" =~ -(alpha|beta|rc)\.[1-9][0-9]*$ ]]; then
            gh release edit "$tag" --draft=false --prerelease --title "$title" --notes-file release/RELEASE_NOTES.md
          else
            gh release edit "$tag" --draft=false --latest --title "$title" --notes-file release/RELEASE_NOTES.md
          fi
