name: Publish public release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '已有发行标签，例如 v0.3.0-beta.5'
        required: true
        type: string
permissions:
  contents: write
env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
concurrency:
  group: public-release-refs/tags/${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  prepare:
    if: github.repository == 'ChuqiCloud/AnyFlows' && github.server_url == 'https://github.com'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      source-sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
      - name: Validate and pin release source
        id: source
        shell: bash
        env:
          RELEASE_MASTER_REF: refs/remotes/origin/main
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          bash tools/ci/verify-release-tag.sh "$RELEASE_TAG" "$source_sha"
          printf 'sha=%s\n' "$source_sha" >> "$GITHUB_OUTPUT"
  build:
    needs: prepare
    if: github.repository == 'ChuqiCloud/AnyFlows' && github.server_url == 'https://github.com'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, target: x86_64-unknown-linux-gnu, binary: af-server, launcher: anyflows-launcher, triplet: unused }
          - { runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, binary: af-server, launcher: anyflows-launcher, triplet: unused }
          - { runner: windows-2025, target: x86_64-pc-windows-msvc, binary: af-server.exe, launcher: anyflows-launcher.exe, triplet: x64-windows-static }
          - { runner: windows-11-arm, target: aarch64-pc-windows-msvc, binary: af-server.exe, launcher: anyflows-launcher.exe, triplet: arm64-windows-static }
          - { runner: macos-15-intel, target: x86_64-apple-darwin, binary: af-server, launcher: anyflows-launcher, triplet: unused }
          - { runner: macos-15, target: aarch64-apple-darwin, binary: af-server, launcher: anyflows-launcher, triplet: unused }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: always
      CARGO_BUILD_JOBS: '2'
    steps:
      - name: Check out tagged source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.prepare.outputs.source-sha }}
          fetch-depth: 0
      - name: Validate release tag
        env:
          RELEASE_MASTER_REF: refs/remotes/origin/main
        run: bash tools/ci/verify-release-tag.sh "$RELEASE_TAG" "$(git rev-parse HEAD)"
      - name: Install Rust toolchain
        if: runner.os != 'Linux'
        run: |
          if [[ "$RUNNER_OS" == 'Windows' ]]; then
            GITHUB_ENV= GITHUB_PATH= bash tools/ci/install-rustup.sh
            cygpath -w "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          else
            bash tools/ci/install-rustup.sh
          fi
          export PATH="$HOME/.cargo/bin:$PATH"
          toolchain="$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$toolchain" --profile minimal --target '${{ matrix.target }}'
      - name: Cache Rust release artifacts
        if: runner.os != 'Linux'
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
        with:
          key: public-release-${{ matrix.target }}
      - name: Restore Bookworm release artifacts
        id: bookworm-cache
        if: runner.os == 'Linux'
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            target/bookworm
            target/bookworm-cargo
          key: public-release-bookworm-${{ matrix.target }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'tools/ci/build-linux-release.sh') }}-${{ needs.prepare.outputs.source-sha }}
          restore-keys: |
            public-release-bookworm-${{ matrix.target }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'tools/ci/build-linux-release.sh') }}-
            public-release-bookworm-${{ matrix.target }}-
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
      - name: Prepare native OpenSSL
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            echo "OPENSSL_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
            echo "OPENSSL_STATIC=1" >> "$GITHUB_ENV"
            echo "MACOSX_DEPLOYMENT_TARGET=15.0" >> "$GITHUB_ENV"
          elif [[ "$RUNNER_OS" == "Windows" ]]; then
            if [[ '${{ matrix.target }}' == 'aarch64-pc-windows-msvc' ]]; then
              clang --version
            fi
            vcpkg_root="$(cygpath -m "$(dirname "$(command -v vcpkg)")")"
            vcpkg install --vcpkg-root "$vcpkg_root" openssl:${{ matrix.triplet }}
            openssl_dir="$vcpkg_root/installed/${{ matrix.triplet }}"
            test -f "$openssl_dir/include/openssl/ssl.h"
            test -f "$openssl_dir/lib/libssl.lib"
            test -f "$openssl_dir/lib/libcrypto.lib"
            printf 'VCPKG_ROOT=%s\n' "$vcpkg_root" >> "$GITHUB_ENV"
            printf 'OPENSSL_DIR=%s\n' "$openssl_dir" >> "$GITHUB_ENV"
            echo "RUSTFLAGS=-C target-feature=+crt-static" >> "$GITHUB_ENV"
            echo "VCPKGRS_TRIPLET=${{ matrix.triplet }}" >> "$GITHUB_ENV"
            echo "OPENSSL_STATIC=1" >> "$GITHUB_ENV"
          fi
      - name: Build embedded frontends
        run: |
          corepack enable
          corepack pnpm@10.33.0 --dir web install --frozen-lockfile
          corepack pnpm@10.33.0 --dir web-next install --frozen-lockfile
          corepack pnpm@10.33.0 --dir web build
          corepack pnpm@10.33.0 --dir web-next build
      - name: Build native release binary
        id: native-build
        run: |
          export AF_BUILD_COMMIT="$(git rev-parse HEAD)"
          export AF_BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          if [[ "$RUNNER_OS" == 'Linux' ]]; then
            bash tools/ci/build-linux-release.sh '${{ matrix.target }}'
          else
            cargo build --release --locked --package af-server --package af-launcher --target '${{ matrix.target }}'
          fi
      - name: Package and verify embedded identity
        run: |
          binary_root=target
          if [[ "$RUNNER_OS" == 'Linux' ]]; then binary_root=target/bookworm; fi
          python tools/ci/package-platform.py "$RELEASE_TAG" '${{ matrix.target }}' "$binary_root/${{ matrix.target }}/release/${{ matrix.binary }}" "$binary_root/${{ matrix.target }}/release/${{ matrix.launcher }}"
      - name: Retain native release files
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: release/*
          if-no-files-found: error
      - name: Save completed Bookworm compilation artifacts
        if: ${{ always() && !cancelled() && runner.os == 'Linux' && steps.native-build.outputs.cache-ready == 'true' && steps.bookworm-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            target/bookworm
            target/bookworm-cargo
          key: ${{ steps.bookworm-cache.outputs.cache-primary-key }}
  publish:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.prepare.outputs.source-sha }}
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release
      - name: Verify complete release matrix
        run: |
          set -euo pipefail
          test "$(find release -name '*.sha256' | wc -l)" -eq 12
          cat release/*.sha256 | sort -k2 > release/SHA256SUMS
          (cd release && sha256sum --check --strict SHA256SUMS)
          version="${RELEASE_TAG#v}"
          awk -v header="## $version" '
            $0 == header || index($0, header " - ") == 1 { found = 1; print; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release/CHANGELOG.md
          test -s release/CHANGELOG.md
          { printf '# AnyFlows %s\n\nLinux、Windows、macOS 的 amd64 与 arm64 原生包，包含 Classic、Next 内置前端。\n\n' "$RELEASE_TAG"; cat release/CHANGELOG.md; printf '\n## SHA-256\n\n```text\n'; cat release/SHA256SUMS; printf '```\n'; } > release/RELEASE_NOTES.md
      - name: Publish complete GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          if gh release view "$tag" --json isDraft > release/existing-release.json 2>/dev/null; then
            jq -e '.isDraft == true' release/existing-release.json >/dev/null || { echo 'Version already published; create a new version.' >&2; exit 1; }
          else
            gh release create "$tag" --draft --verify-tag --title "AnyFlows $tag" --notes-file release/RELEASE_NOTES.md
          fi
          find release -maxdepth 1 -type f ! -name '*.md' ! -name '*.json' -print0 | xargs -0 gh release upload "$tag" --clobber
          if [[ "$tag" =~ -(alpha|beta|rc)\.[1-9][0-9]*$ ]]; then
            gh release edit "$tag" --draft=false --prerelease --title "AnyFlows $tag" --notes-file release/RELEASE_NOTES.md
          else
            gh release edit "$tag" --draft=false --latest --title "AnyFlows $tag" --notes-file release/RELEASE_NOTES.md
          fi
