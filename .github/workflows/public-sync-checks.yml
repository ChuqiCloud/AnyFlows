name: Public sync checks

on:
  push:
    branches: [main, develop]
    paths:
      - .github/workflows/**
      - tools/ci/check-workflow-actions.py
      - tools/ci/*container-test-runner.sh
      - tools/ci/run-cache-redis-test.sh
      - tools/repository/**
      - tools/ci/test-public-core-export.sh
      - tools/ci/verify-public-core-boundary.py
      - docs/**
      - '*.md'
      - web/src/i18n/locales/*.json
      - web-next/src/i18n/locales/*.json
  pull_request:
    branches: [main, develop]
    paths:
      - .github/workflows/**
      - tools/ci/check-workflow-actions.py
      - tools/ci/*container-test-runner.sh
      - tools/ci/run-cache-redis-test.sh
      - tools/repository/**
      - tools/ci/test-public-core-export.sh
      - tools/ci/verify-public-core-boundary.py
      - docs/**
      - '*.md'
      - web/src/i18n/locales/*.json
      - web-next/src/i18n/locales/*.json

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-sync-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  export:
    name: Validate public sync and export
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        shell: bash
        env:
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}.git
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          auth="$(printf 'x-access-token:%s' "$SOURCE_TOKEN" | base64 -w0)"
          git init -q .
          git remote add origin "$SOURCE_URL"
          git -c http.extraheader="AUTHORIZATION: basic $auth" fetch --quiet --no-tags --depth=1 origin "$SOURCE_SHA"
          git checkout -q --detach FETCH_HEAD

      - name: Check portable workflow action references
        run: python3 tools/ci/check-workflow-actions.py

      - name: Check container test entry points
        run: |
          for script in tools/ci/container-test-runner.sh tools/ci/run-cache-redis-test.sh; do
            bash -n "$script"
          done
          bash tools/ci/test-container-test-runner.sh

      - name: Check export and synchronization regressions
        run: bash tools/ci/test-public-core-export.sh

      - name: Check proposed export against public main
        shell: bash
        run: |
          set -euo pipefail
          destination="$(mktemp -d)"
          trap 'rm -rf "$destination"' EXIT
          git clone --quiet --single-branch --branch main \
            https://github.com/ChuqiCloud/AnyFlows.git "$destination"
          python3 tools/repository/export-public-core.py \
            --source . --destination "$destination" --commit HEAD --allow-replace
