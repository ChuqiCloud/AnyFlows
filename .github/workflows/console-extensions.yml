name: Console extensions

on:
  # 历史专项保留手动复测入口，日常检查由 CI 工作流承担。
  workflow_dispatch:
    inputs:
      scenario:
        description: 浏览器检查范围
        required: true
        default: extensions
        type: choice
        options:
          - extensions
          - usage-logs
          - software-updates

permissions:
  contents: read

concurrency:
  group: console-extensions-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        frontend: [web, web-next]
    steps:
      - name: Check out repository
        shell: bash
        env:
          CHECKOUT_REPOSITORY_URL: ${{ github.server_url != 'https://github.com' && vars.SOURCE_BASE_URL || github.server_url }}/${{ github.repository }}.git
          CHECKOUT_SHA: ${{ github.sha }}
          CHECKOUT_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repository_url="$CHECKOUT_REPOSITORY_URL"
          auth="$(printf 'x-access-token:%s' "$CHECKOUT_TOKEN" | base64 -w0)"
          git init .
          git remote add origin "$repository_url"
          git -c http.extraheader="AUTHORIZATION: basic $auth" fetch --no-tags --depth=1 origin "$CHECKOUT_SHA"
          git checkout --detach FETCH_HEAD
      - name: Prepare pinned Node setup action
        run: |
          set -euo pipefail
          action_path='.ci-actions/setup-node'
          action_sha='49933ea5288caeca8642d1e84afbd3f7d6820020'
          git init --quiet "$action_path"
          git -C "$action_path" remote add origin https://github.com/actions/setup-node.git
          git -C "$action_path" fetch --quiet --no-tags --depth=1 origin "$action_sha"
          git -C "$action_path" checkout --quiet --detach FETCH_HEAD
          test "$(git -C "$action_path" rev-parse HEAD)" = "$action_sha"
      - uses: ./.ci-actions/setup-node
        with:
          node-version: '24'
      - name: Install package manager and locked dependencies
        run: |
          npx --yes --package=corepack@0.34.0 corepack pnpm@10.33.0 --dir ${{ matrix.frontend }} install --frozen-lockfile
      - name: Check scripts and community contracts
        run: |
          node tools/ci/check-frontend-parity.mjs
          npx --yes --package=corepack@0.34.0 corepack pnpm@10.33.0 --dir ${{ matrix.frontend }} lint
      - name: Build community frontend
        run: npx --yes --package=corepack@0.34.0 corepack pnpm@10.33.0 --dir ${{ matrix.frontend }} build
      - name: Check selected console scenario in Chromium
        env:
          SCENARIO: ${{ github.event.inputs.scenario || 'extensions' }}
        run: |
          set -euo pipefail
          browser_tools="$RUNNER_TEMP/anyflows-playwright"
          npm install --prefix "$browser_tools" --no-save --ignore-scripts playwright@1.56.1
          # GitHub-hosted Ubuntu already includes Chromium runtime libraries; --with-deps
          # also refreshes the Microsoft APT source, which can transiently return 403.
          if [[ "${{ github.server_url }}" == "https://github.com" ]]; then
            "$browser_tools/node_modules/.bin/playwright" install chromium
          else
            "$browser_tools/node_modules/.bin/playwright" install --with-deps chromium
          fi
          case "$SCENARIO" in
            extensions)
              PLAYWRIGHT_PACKAGE_ROOT="$browser_tools" node tools/ci/frontend-client-profiles-smoke.mjs '${{ matrix.frontend }}'
              PLAYWRIGHT_PACKAGE_ROOT="$browser_tools" node tools/ci/frontend-proxy-pools-smoke.mjs '${{ matrix.frontend }}'
              ;;
            software-updates)
              PLAYWRIGHT_PACKAGE_ROOT="$browser_tools" node tools/ci/frontend-verification-smoke.mjs '${{ matrix.frontend }}'
              ;;
            usage-logs)
              PLAYWRIGHT_PACKAGE_ROOT="$browser_tools" node tools/ci/frontend-usage-logs-smoke.mjs '${{ matrix.frontend }}'
              ;;
            *)
              printf 'Unsupported console scenario: %s\n' "$SCENARIO" >&2
              exit 1
              ;;
          esac
