name: Export public core

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-core-export-${{ github.ref }}
  cancel-in-progress: false

jobs:
  export:
    if: ${{ github.repository == 'acmecloud/AnyFlows' }}
    name: Export Gitea develop to GitHub
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GITHUB_PUBLIC_REPOSITORY: ChuqiCloud/AnyFlows
      GITHUB_PUBLIC_BRANCH: main
      GITEA_SOURCE_REPOSITORY_URL: https://gitea.acmecloud.cn/acmecloud/AnyFlows
      GITEA_REPOSITORY: acmecloud/AnyFlows
      GITEA_API_BASE: ${{ github.server_url }}/api/v1
      PUBLIC_REPO_SYNC_TOKEN: ${{ secrets.PUBLIC_REPO_SYNC_TOKEN }}
      GITEA_COMMIT: ${{ github.sha }}
    steps:
      - name: Validate sync credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PUBLIC_REPO_SYNC_TOKEN" || {
            echo 'PUBLIC_REPO_SYNC_TOKEN is not configured' >&2
            exit 1
          }
          [[ "$GITEA_COMMIT" =~ ^[0-9a-f]{40}$ ]] || {
            echo 'Gitea commit is invalid' >&2
            exit 1
          }

      - name: Check out Gitea source
        shell: bash
        env:
          CHECKOUT_REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}.git
          CHECKOUT_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          auth="$(printf 'x-access-token:%s' "$CHECKOUT_TOKEN" | base64 -w0)"
          git init -q gitea-source
          git -C gitea-source remote add origin "$CHECKOUT_REPOSITORY_URL"
          git -C gitea-source -c http.extraheader="AUTHORIZATION: basic $auth" \
            fetch --no-tags --depth=1 origin "$GITEA_COMMIT"
          git -C gitea-source checkout -q --detach FETCH_HEAD

      - name: Read source PR context
        shell: bash
        env:
          GITEA_API_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          metadata="$RUNNER_TEMP/source-pr-metadata.json"
          jq -n '{title: "同步 Gitea 公共核心", body: "", url: "", number: null, mergeCommitSha: ""}' > "$metadata"
          message="$(git -C gitea-source show -s --format=%B "$GITEA_COMMIT")"
          pr_number=""
          if [[ "$message" =~ \(\#([0-9]+)\) ]]; then
            pr_number="${BASH_REMATCH[1]}"
          fi

          if [ -z "$pr_number" ]; then
            exit 0
          fi

          if pr="$(curl --fail --silent --show-error --connect-timeout 5 --max-time 15 \
            -H "Authorization: token $GITEA_API_TOKEN" \
            -H 'Accept: application/json' \
            "$GITEA_API_BASE/repos/$GITEA_REPOSITORY/pulls/$pr_number")" &&
            jq -e --argjson number "$pr_number" --arg sha "$GITEA_COMMIT" '
              select(type == "object") |
              select(.number == $number and .merged == true and
                .merge_commit_sha == $sha and .base.ref == "develop") |
              select((.title | type == "string" and length > 0) and
                (.body == null or (.body | type == "string")) and
                (.html_url | type == "string" and length > 0)) |
              {title: .title, body: (.body // ""), url: .html_url,
                number: .number, mergeCommitSha: .merge_commit_sha}' \
              <<<"$pr" > "$metadata.tmp"; then
            mv "$metadata.tmp" "$metadata"
          else
            rm -f "$metadata.tmp"
            echo "::warning::Source Gitea PR #$pr_number metadata is unavailable; using the default sync title and description."
          fi

      - name: Check out public repository
        shell: bash
        run: |
          set -euo pipefail
          askpass="$RUNNER_TEMP/github-askpass"
          trap 'rm -f "$askpass"' EXIT
          cat > "$askpass" <<'EOF'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s' 'x-access-token' ;;
            *) printf '%s' "$PUBLIC_REPO_SYNC_TOKEN" ;;
          esac
          EOF
          chmod 700 "$askpass"
          export GIT_ASKPASS="$askpass"
          export GIT_TERMINAL_PROMPT=0
          git clone --quiet --branch "$GITHUB_PUBLIC_BRANCH" --single-branch \
            "https://github.com/$GITHUB_PUBLIC_REPOSITORY.git" github-public

      - name: Prepare export branch
        id: branch
        shell: bash
        run: |
          set -euo pipefail
          askpass="$RUNNER_TEMP/github-askpass"
          trap 'rm -f "$askpass"' EXIT
          cat > "$askpass" <<'EOF'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s' 'x-access-token' ;;
            *) printf '%s' "$PUBLIC_REPO_SYNC_TOKEN" ;;
          esac
          EOF
          chmod 700 "$askpass"
          export GIT_ASKPASS="$askpass"
          export GIT_TERMINAL_PROMPT=0
          export_branch="sync/gitea-public-core"
          git -C github-public fetch --quiet origin "$GITHUB_PUBLIC_BRANCH"
          if git -C github-public ls-remote --exit-code origin "refs/heads/$export_branch" >/dev/null 2>&1; then
            git -C github-public fetch --quiet origin "$export_branch"
            expected_branch_sha="$(git -C github-public rev-parse "FETCH_HEAD^{commit}")"
          else
            expected_branch_sha=""
          fi
          git -C github-public checkout -q -B "$export_branch" "origin/$GITHUB_PUBLIC_BRANCH"
          echo "export_branch=$export_branch" >> "$GITHUB_OUTPUT"
          echo "expected_branch_sha=$expected_branch_sha" >> "$GITHUB_OUTPUT"

      - name: Export and validate public core
        id: export
        shell: bash
        run: |
          set -euo pipefail
          python3 gitea-source/tools/repository/export-public-core.py \
            --source gitea-source \
            --destination github-public \
            --commit "$GITEA_COMMIT" \
            --allow-replace
          git -C github-public add -A
          if git -C github-public diff --cached --quiet -- . \
            ':(exclude)docs/public-core-source.json'; then
            echo 'has_changes=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git -C github-public config user.name 'gitea-sync[bot]'
          git -C github-public config user.email 'gitea-sync[bot]@users.noreply.github.com'
          git -C github-public commit -q -m "同步 Gitea 公共核心 $GITEA_COMMIT"
          echo 'has_changes=true' >> "$GITHUB_OUTPUT"

      - name: Push public export branch
        if: ${{ steps.export.outputs.has_changes == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          askpass="$RUNNER_TEMP/github-askpass"
          trap 'rm -f "$askpass"' EXIT
          cat > "$askpass" <<'EOF'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s' 'x-access-token' ;;
            *) printf '%s' "$PUBLIC_REPO_SYNC_TOKEN" ;;
          esac
          EOF
          chmod 700 "$askpass"
          export GIT_ASKPASS="$askpass"
          export GIT_TERMINAL_PROMPT=0
          expected_branch_sha="${{ steps.branch.outputs.expected_branch_sha }}"
          if [ -n "$expected_branch_sha" ]; then
            lease="refs/heads/${{ steps.branch.outputs.export_branch }}:$expected_branch_sha"
          else
            lease="refs/heads/${{ steps.branch.outputs.export_branch }}:"
          fi
          git -C github-public push --quiet --force-with-lease="$lease" origin \
            "HEAD:${{ steps.branch.outputs.export_branch }}"

      - name: Create or reuse GitHub pull request
        if: ${{ steps.export.outputs.has_changes == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/$GITHUB_PUBLIC_REPOSITORY"
          head="${{ steps.branch.outputs.export_branch }}"
          metadata="$RUNNER_TEMP/source-pr-metadata.json"
          source_title="$(jq -r '.title' "$metadata")"
          source_body="$(jq -r '.body' "$metadata")"
          source_pr_url="$(jq -r '.url' "$metadata")"
          source_pr_number="$(jq -r '.number // empty' "$metadata")"
          body="$(jq -rn --arg source_body "$source_body" --arg url "$source_pr_url" \
            --arg pr "$source_pr_number" --arg sha "$GITEA_COMMIT" --arg repo "$GITEA_SOURCE_REPOSITORY_URL" \
            --arg source_repo "$GITEA_REPOSITORY" \
            --arg merge_sha "$(jq -r '.mergeCommitSha // ""' "$metadata")" \
            '$source_body + (if $source_body == "" then "" else "\n\n" end) +
             (if $url != "" then "来源 PR：" + $url + "\n" else "" end) +
             (if $pr != "" then "来源 PR 编号：#" + $pr + "\n" else "" end) +
             "来源提交：" + $sha + "\n来源仓库：" + $repo +
             (if $pr != "" and ($merge_sha | test("^[0-9a-f]{40}$")) then
               "\n\n<!-- anyflows-pr-source:gitea:" + $source_repo + ":" + $pr + ":" + $merge_sha + " -->"
              else "" end)')"
          existing="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $PUBLIC_REPO_SYNC_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$api/pulls?state=open&head=ChuqiCloud:$head&base=$GITHUB_PUBLIC_BRANCH")"
          number=""
          if jq -e 'length > 0' >/dev/null <<<"$existing"; then
            number="$(jq -r '.[0].number' <<<"$existing")"
            payload="$(jq -n --arg title "$source_title" --arg body "$body" \
              '{title: $title, body: $body}')"
            curl --fail --silent --show-error --request PATCH \
              -H "Authorization: Bearer $PUBLIC_REPO_SYNC_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              -H 'Content-Type: application/json' \
              --data "$payload" "$api/pulls/$number" >/dev/null
          else
            payload="$(jq -n \
              --arg title "$source_title" \
              --arg head "$head" \
              --arg base "$GITHUB_PUBLIC_BRANCH" \
              --arg body "$body" \
              '{title: $title, head: $head, base: $base, body: $body}')"
            created="$(curl --fail --silent --show-error --request POST \
              -H "Authorization: Bearer $PUBLIC_REPO_SYNC_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              -H 'Content-Type: application/json' \
              --data "$payload" "$api/pulls")"
            number="$(jq -r '.number' <<<"$created")"
          fi
