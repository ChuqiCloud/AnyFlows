          auth="$(printf 'x-access-token:%s' "$CHECKOUT_TOKEN" | base64 -w0)"
          git init .
          git remote add origin "$CHECKOUT_REPOSITORY_URL"
          git -c http.extraheader="AUTHORIZATION: basic $auth" fetch --no-tags --depth=1 origin "$CHECKOUT_SHA"
          git checkout --detach FETCH_HEAD

      - name: Ensure Rust toolchain manager
        shell: bash
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup --version

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          toolchain="$(sed -n 's/^channel = \"\(.*\)\"/\1/p' rust-toolchain.toml)"
          test -n "$toolchain"
          rustup toolchain install "$toolchain" --profile minimal

      - name: Cache database test artifacts
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: database-mysql

      - name: Run MySQL migration smoke test on Gitea
        if: ${{ github.server_url != 'https://github.com' }}
        env:
          AF_TEST_DATABASE_URL: mysql://anyflows:anyflows_ci@mysql:3306/anyflows_migration_test_ci?timezone=%2B08:00
          AF_REQUIRE_LIVE_DATABASE: "1"
          AF_ALLOW_DESTRUCTIVE_MIGRATION_TEST: "1"
        run: bash tools/ci/run-db-migration-test.sh mysql

      - name: Run MySQL migration smoke test on GitHub
        if: ${{ github.server_url == 'https://github.com' }}
        env:
          AF_TEST_DATABASE_URL: mysql://anyflows:anyflows_ci@127.0.0.1:13306/anyflows_migration_test_ci?timezone=%2B08:00
          AF_REQUIRE_LIVE_DATABASE: "1"
          AF_ALLOW_DESTRUCTIVE_MIGRATION_TEST: "1"
        run: bash tools/ci/run-db-migration-test.sh mysql

  cache-redis:
    name: Redis cache smoke test
    needs: changes
    if: ${{ needs.changes.outputs.redis == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      redis:
        image: redis:8.2.7-bookworm@sha256:d30960f73a599496d8b2802c97758bab6b1cd421fd06337f837779c47a57e1f3
        ports:
          - 16379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    steps:
      - name: Configure external Gitea checkout endpoint
        if: ${{ startsWith(github.server_url, 'http://gitea_cps3:') }}
        shell: bash
        run: |
          set -euo pipefail
          git config --global url."https://gitea.acmecloud.cn/".insteadOf "http://gitea_cps3:3000/"

      - name: Check out repository
        shell: bash
        env:
          CHECKOUT_REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}.git
          CHECKOUT_SHA: ${{ github.sha }}
          CHECKOUT_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          auth="$(printf 'x-access-token:%s' "$CHECKOUT_TOKEN" | base64 -w0)"
          git init .
          git remote add origin "$CHECKOUT_REPOSITORY_URL"
          git -c http.extraheader="AUTHORIZATION: basic $auth" fetch --no-tags --depth=1 origin "$CHECKOUT_SHA"
          git checkout --detach FETCH_HEAD

      - name: Ensure Rust toolchain manager
        shell: bash
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup --version

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          toolchain="$(sed -n 's/^channel = \"\(.*\)\"/\1/p' rust-toolchain.toml)"
          test -n "$toolchain"
          rustup toolchain install "$toolchain" --profile minimal

      - name: Cache Redis test artifacts
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: cache-redis

      - name: Run Redis cache smoke test on Gitea
        if: ${{ github.server_url != 'https://github.com' }}
        env:
          AF_TEST_REDIS_URL: redis://redis:6379/
          AF_REQUIRE_LIVE_REDIS: "1"
        run: bash tools/ci/run-cache-redis-test.sh

      - name: Run Redis cache smoke test on GitHub
        if: ${{ github.server_url == 'https://github.com' }}
        env:
          AF_TEST_REDIS_URL: redis://127.0.0.1:16379/
          AF_REQUIRE_LIVE_REDIS: "1"
        run: bash tools/ci/run-cache-redis-test.sh
