name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # 同一 PR 只保留最新一轮；不同 PR 可并行使用已扩容的流水线资源。
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # 独立检查使用不同 job 并行执行；每个 job 限制编译资源，兼容受限 runner。
  CARGO_BUILD_JOBS: "1"
  CARGO_INCREMENTAL: "0"
  # 开发与测试产物关闭调试符号，避免大型数据库检查在受限 runner 中触发 OOM。
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  # 失败时保留已完成的 Rust 产物，后续修复无需重复冷编译全部依赖。
  CACHE_ON_FAILURE: "true"
  RUST_BACKTRACE: "1"

jobs:
  changes:
    name: Detect changed components
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      full: ${{ steps.paths.outputs.full }}
      frontend: ${{ steps.paths.outputs.frontend }}
      frontend_about: ${{ steps.paths.outputs.frontend_about }}
      frontend_navigation: ${{ steps.paths.outputs.frontend_navigation }}
      rust: ${{ steps.paths.outputs.rust }}
      database: ${{ steps.paths.outputs.database }}
      redis: ${{ steps.paths.outputs.redis }}
      clickhouse: ${{ steps.paths.outputs.clickhouse }}
      deployment: ${{ steps.paths.outputs.deployment }}
      systemd: ${{ steps.paths.outputs.systemd }}
      release: ${{ steps.paths.outputs.release }}
    steps:
      - name: Configure checkout endpoint
        if: ${{ github.server_url != 'https://github.com' && vars.SOURCE_BASE_URL != '' }}
        shell: bash
        env:
          CHECKOUT_SERVER_URL: ${{ github.server_url }}
          CHECKOUT_EXTERNAL_URL: ${{ vars.SOURCE_BASE_URL }}
        run: |
          set -euo pipefail
          git config --global url."${CHECKOUT_EXTERNAL_URL%/}/".insteadOf "${CHECKOUT_SERVER_URL%/}/"

      - name: Detect changed paths
        id: paths
        shell: bash
        env:
          CHECKOUT_REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}.git
          CHECKOUT_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          TARGET_BRANCH: ${{ github.base_ref || github.ref_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          # 开发 PR 运行基础校验；完整集成与发行检查在 main 或手动复测时执行。
          if [[ "$EVENT_NAME" == "workflow_dispatch" || "$TARGET_BRANCH" == "main" ]]; then
            echo "full=true" >> "$GITHUB_OUTPUT"
          else
            echo "full=false" >> "$GITHUB_OUTPUT"
          fi

          emit_all() {
            {
              echo "frontend=true"
              echo "frontend_about=true"
              echo "frontend_navigation=true"
              echo "rust=true"
              echo "database=true"
              echo "redis=true"
              echo "clickhouse=true"
              echo "deployment=true"
              echo "systemd=true"
              echo "release=true"
            } >> "$GITHUB_OUTPUT"
          }

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            emit_all
            exit 0
          fi

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base_sha="$PR_BASE_SHA"
            head_sha="$PR_HEAD_SHA"
          else
            base_sha="$PUSH_BEFORE_SHA"
            head_sha="$PUSH_AFTER_SHA"
          fi

          if [[ -z "$base_sha" || -z "$head_sha" || "$base_sha" =~ ^0+$ ]]; then
            emit_all
            exit 0
          fi

          auth="$(printf 'x-access-token:%s' "$CHECKOUT_TOKEN" | base64 -w0)"
          git init .
          git remote add origin "$CHECKOUT_REPOSITORY_URL"
          git -c http.extraheader="AUTHORIZATION: basic $auth" fetch --no-tags --depth=1 origin "$base_sha" "$head_sha"
          git diff --name-only "$base_sha" "$head_sha" > changed-files.txt
          cat changed-files.txt

          matches() {
            if grep -Eq "$1" changed-files.txt; then
              echo true
            else
              echo false
            fi
          }

          {
            echo "frontend=$(matches '^(web/|web-next/|tools/ci/(check-frontend-parity|frontend-about-smoke|frontend-navigation-smoke)\.mjs$|\.github/workflows/ci\.yml$)')"
            echo "frontend_about=$(matches '^((web|web-next)/src/features/(about/|site-settings/software-(update-(panel|api)|release-notes)\.tsx?$)|tools/ci/frontend-about-smoke\.mjs$|\.github/workflows/ci\.yml$)')"
            echo "frontend_navigation=$(matches '^(web-next/|tools/ci/frontend-navigation-smoke\.mjs$|\.github/workflows/ci\.yml$)')"
            echo "rust=$(matches '^(crates/|tools/xtask/|\.cargo/|Cargo\.(toml|lock)$|rust-toolchain\.toml$|rustfmt\.toml$|clippy\.toml$|deny\.toml$|\.github/workflows/ci\.yml$)')"
            echo "database=$(matches '^(crates/af-db/|tools/ci/(run-db-migration-test|container-test-runner)\.sh$|Cargo\.(toml|lock)$|rust-toolchain\.toml$)')"
            echo "redis=$(matches '^(crates/af-cache/|tools/ci/(run-cache-redis-test|container-test-runner)\.sh$|Cargo\.(toml|lock)$|rust-toolchain\.toml$)')"
            echo "clickhouse=$(matches '^(crates/af-server/src/admin_dashboard_storage/clickhouse\.rs$|crates/af-server/tests/admin_dashboard_chain\.rs$|tools/ci/run-clickhouse-integration-test\.sh$)')"
            echo "deployment=$(matches '^(Dockerfile$|docker-compose\.ya?ml$|\.dockerignore$|scripts/deploy/)')"
            echo "systemd=$(matches '^(scripts/systemd/|tools/ci/(package-release|finalize-release|test-release-scripts|verify-release-tag)\.sh$|\.cnb/release\.yml$)')"
            echo "release=$(matches '^(Cargo\.(toml|lock)$|rust-toolchain\.toml$|\.github/workflows/(ci|publish-public-release|release-checks)\.yml$|tools/ci/(build-linux-release|package-release|finalize-release|test-release-scripts|verify-release-tag)\.sh$|tools/ci/.*platform\.py$)')"
          } >> "$GITHUB_OUTPUT"

  deployment:
    name: Docker deployment checks
    needs: changes
    if: ${{ needs.changes.outputs.full == 'true' && needs.changes.outputs.deployment == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out repository
        shell: bash
        env:
          CHECKOUT_REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}.git
          CHECKOUT_SHA: ${{ github.sha }}
          CHECKOUT_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          auth="$(printf 'x-access-token:%s' "$CHECKOUT_TOKEN" | base64 -w0)"
          git init .
          git remote add origin "$CHECKOUT_REPOSITORY_URL"
          git -c http.extraheader="AUTHORIZATION: basic $auth" fetch --no-tags --depth=1 origin "$CHECKOUT_SHA"
          git checkout --detach FETCH_HEAD

      - name: Check Docker tooling
        shell: bash
        run: |
          set -euo pipefail
          docker version
          docker compose version

      - name: Render Compose configuration
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' \
            'POSTGRES_PASSWORD=ci-only-password' \
            'AF_AUTH__SESSION_SIGNING_KEY=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA' \
            'AF_CREDENTIAL_ENCRYPTION__KEY_ID=ci' \
            'AF_CREDENTIAL_ENCRYPTION__KEY=BBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBB' \
            > .env
          docker compose --env-file .env config --quiet

      - name: Build runtime image
        shell: bash
        run: |
          set -euo pipefail
          docker build --target runtime --tag anyflows:ci .

      - name: Verify runtime security contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(docker image inspect anyflows:ci --format '{{.Config.User}}')" = "anyflows"
          test "$(docker image inspect anyflows:ci --format '{{json .Config.Healthcheck.Test}}')" = '["CMD-SHELL","wget --no-verbose --tries=1 --spider http://127.0.0.1:8080/healthz || exit 1"]'
          test "$(docker image inspect anyflows:ci --format '{{json .Config.Volumes}}')" = '{"/app/data":{}}'

  systemd:
    name: systemd deployment checks
    needs: changes
    if: ${{ needs.changes.outputs.full == 'true' && needs.changes.outputs.systemd == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        shell: bash
        env:
          CHECKOUT_REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}.git
          CHECKOUT_SHA: ${{ github.sha }}
          CHECKOUT_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          auth="$(printf 'x-access-token:%s' "$CHECKOUT_TOKEN" | base64 -w0)"
          git init .
          git remote add origin "$CHECKOUT_REPOSITORY_URL"
          git -c http.extraheader="AUTHORIZATION: basic $auth" fetch --no-tags --depth=1 origin "$CHECKOUT_SHA"
          git checkout --detach FETCH_HEAD

      - name: Check systemd assets and shell syntax
        shell: bash
        run: |
          set -euo pipefail
          test -x scripts/systemd/install.sh
          bash -n scripts/systemd/install.sh
          grep -q '^User=anyflows$' scripts/systemd/anyflows.service
          grep -q '^ProtectSystem=strict$' scripts/systemd/anyflows.service
          grep -q '^ReadWritePaths=/var/lib/anyflows$' scripts/systemd/anyflows.service

          # systemd-analyze 会解析运行时路径，门禁先准备最小静态夹具。
          sudo install -d -o root -g root -m 0755 \
            /usr/local/libexec/anyflows /etc/anyflows /var/lib/anyflows
          if ! getent group anyflows >/dev/null 2>&1; then
            sudo groupadd --system anyflows
          fi
          if ! id -u anyflows >/dev/null 2>&1; then
            sudo useradd --system --gid anyflows --no-create-home \
              --home-dir /var/lib/anyflows --shell /usr/sbin/nologin anyflows
          fi
          printf '%s\n' '# systemd-analyze CI fixture' \
            | sudo tee /etc/anyflows/anyflows.env >/dev/null
          printf '%s\n' '#!/bin/sh' 'exit 0' \
            | sudo tee /usr/local/libexec/anyflows/anyflows >/dev/null
          sudo chmod 0755 /usr/local/libexec/anyflows/anyflows
          sudo cp /usr/local/libexec/anyflows/anyflows /usr/local/libexec/anyflows/anyflows-launcher
          systemd-analyze verify scripts/systemd/anyflows.service

      - name: Verify release archive includes systemd assets
        shell: bash
        run: bash tools/ci/test-release-scripts.sh

  release-package:
    name: Linux amd64 release package
    needs: changes
    if: ${{ needs.changes.outputs.release == 'true' || (needs.changes.outputs.full == 'true' && needs.changes.outputs.rust == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Configure checkout endpoint
        if: ${{ github.server_url != 'https://github.com' && vars.SOURCE_BASE_URL != '' }}
        shell: bash
        env:
          CHECKOUT_SERVER_URL: ${{ github.server_url }}
          CHECKOUT_EXTERNAL_URL: ${{ vars.SOURCE_BASE_URL }}
        run: |
          set -euo pipefail
          git config --global url."${CHECKOUT_EXTERNAL_URL%/}/".insteadOf "${CHECKOUT_SERVER_URL%/}/"

      - name: Check out repository
        shell: bash
        env:
          CHECKOUT_REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}.git
          CHECKOUT_SHA: ${{ github.sha }}
          CHECKOUT_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          auth="$(printf 'x-access-token:%s' "$CHECKOUT_TOKEN" | base64 -w0)"
          git init .
          git remote add origin "$CHECKOUT_REPOSITORY_URL"
          git -c http.extraheader="AUTHORIZATION: basic $auth" fetch --no-tags --depth=1 origin "$CHECKOUT_SHA"
          git checkout --detach FETCH_HEAD

      - name: Restore Bookworm release artifacts on Gitea
        id: bookworm-cache-gitea
        if: github.server_url != 'https://github.com'
        uses: actions/cache/restore@f4b3439a656ba812b8cb417d2d49f9c810103092 # v3.4.0
        with:
          path: |
            target/bookworm
            target/bookworm-cargo
          key: ci-release-bookworm-x86_64-unknown-linux-gnu-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'tools/ci/build-linux-release.sh') }}-${{ github.sha }}
          restore-keys: |
            ci-release-bookworm-x86_64-unknown-linux-gnu-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'tools/ci/build-linux-release.sh') }}-
            ci-release-bookworm-x86_64-unknown-linux-gnu-

      - name: Restore Bookworm release artifacts on GitHub
        id: bookworm-cache-github
        if: github.server_url == 'https://github.com'
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            target/bookworm
            target/bookworm-cargo
          key: ci-release-bookworm-x86_64-unknown-linux-gnu-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'tools/ci/build-linux-release.sh') }}-${{ github.sha }}
          restore-keys: |
            ci-release-bookworm-x86_64-unknown-linux-gnu-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'tools/ci/build-linux-release.sh') }}-
            ci-release-bookworm-x86_64-unknown-linux-gnu-

      - name: Install frontend dependencies
        shell: bash
        run: |
          corepack enable
          corepack pnpm@10.33.0 --dir web install --frozen-lockfile
          corepack pnpm@10.33.0 --dir web-next install --frozen-lockfile

      - name: Build frontend
        run: |
          corepack pnpm@10.33.0 --dir web build
          corepack pnpm@10.33.0 --dir web-next build

      - name: Build and verify Bookworm release binaries
        id: bookworm-build
        run: |
          export AF_BUILD_COMMIT="$(git rev-parse HEAD)"
          export AF_BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          bash tools/ci/build-linux-release.sh x86_64-unknown-linux-gnu

      - name: Verify release binary identities
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          import subprocess
          import tomllib

          with Path('Cargo.toml').open('rb') as manifest:
              version = tomllib.load(manifest)['workspace']['package']['version']
          target = 'x86_64-unknown-linux-gnu'
          directory = Path('target/bookworm') / target / 'release'
          metadata = json.loads(subprocess.check_output([str((directory / 'af-server').resolve()), '--version'], text=True))
          launcher = json.loads(subprocess.check_output([str((directory / 'anyflows-launcher').resolve()), '--version'], text=True))
          if metadata['target'] != target or metadata['version'] != version:
              raise ValueError('Binary target/version differs from release inputs')
          if launcher['target'] != target or metadata['launcher_protocol'] != launcher['protocol']:
              raise ValueError('Launcher target/protocol differs from main program')
          PY

      - name: Package and verify release archive
        shell: bash
        run: |
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          if [[ "${{ github.server_url }}" == 'https://github.com' ]]; then
            version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
            test -n "$version"
            python3 tools/ci/package-platform.py "v$version" x86_64-unknown-linux-gnu target/bookworm/x86_64-unknown-linux-gnu/release/af-server target/bookworm/x86_64-unknown-linux-gnu/release/anyflows-launcher
          else
            bash tools/ci/package-release.sh auto amd64 \
              target/bookworm/x86_64-unknown-linux-gnu/release/af-server release \
              target/bookworm/x86_64-unknown-linux-gnu/release/anyflows-launcher
          fi
          archive="$(find release -maxdepth 1 -type f -name 'anyflows-v*-linux-amd64.tar.gz' -print -quit)"
          test -n "$archive"
          test -s "$archive"
          test -s "$archive.sha256"

      - name: Save completed Bookworm compilation artifacts on Gitea
        if: ${{ always() && !cancelled() && github.server_url != 'https://github.com' && steps.bookworm-build.outputs.cache-ready == 'true' && steps.bookworm-cache-gitea.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@f4b3439a656ba812b8cb417d2d49f9c810103092 # v3.4.0
        with:
          path: |
            target/bookworm
            target/bookworm-cargo
          key: ${{ steps.bookworm-cache-gitea.outputs.cache-primary-key }}

      - name: Save completed Bookworm compilation artifacts on GitHub
        if: ${{ always() && !cancelled() && github.server_url == 'https://github.com' && steps.bookworm-build.outputs.cache-ready == 'true' && steps.bookworm-cache-github.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            target/bookworm
            target/bookworm-cargo
          key: ${{ steps.bookworm-cache-github.outputs.cache-primary-key }}

  frontend-quality:
    name: Frontend quality gates (${{ matrix.frontend }})
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        frontend: [web, web-next]
    steps:
      - name: Configure checkout endpoint
        if: ${{ github.server_url != 'https://github.com' && vars.SOURCE_BASE_URL != '' }}
        shell: bash
        env:
          CHECKOUT_SERVER_URL: ${{ github.server_url }}
          CHECKOUT_EXTERNAL_URL: ${{ vars.SOURCE_BASE_URL }}
        run: |
          set -euo pipefail
          git config --global url."${CHECKOUT_EXTERNAL_URL%/}/".insteadOf "${CHECKOUT_SERVER_URL%/}/"

      - name: Check out repository
        shell: bash
        env:
          CHECKOUT_REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}.git
          CHECKOUT_SHA: ${{ github.sha }}
          CHECKOUT_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          auth="$(printf 'x-access-token:%s' "$CHECKOUT_TOKEN" | base64 -w0)"
          git init .
          git remote add origin "$CHECKOUT_REPOSITORY_URL"
          git -c http.extraheader="AUTHORIZATION: basic $auth" fetch --no-tags --depth=1 origin "$CHECKOUT_SHA"
          git checkout --detach FETCH_HEAD

      - name: Install frontend dependencies
        shell: bash
        run: |
          corepack enable
          corepack pnpm@10.33.0 --dir ${{ matrix.frontend }} install --frozen-lockfile

      - name: Audit frontend dependencies
        run: corepack pnpm@10.33.0 --dir ${{ matrix.frontend }} audit --audit-level=low

      - name: Check shared frontend parity
        run: node tools/ci/check-frontend-parity.mjs

      - name: Lint frontend
        run: corepack pnpm@10.33.0 --dir ${{ matrix.frontend }} lint

      - name: Build frontend
        run: corepack pnpm@10.33.0 --dir ${{ matrix.frontend }} build

      - name: Install browser runtime for frontend checks
        if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.frontend_about == 'true' || (matrix.frontend == 'web-next' && needs.changes.outputs.frontend_navigation == 'true') }}
        shell: bash
        run: |
          set -euo pipefail
          browser_tools="$RUNNER_TEMP/anyflows-playwright"
          npm install --prefix "$browser_tools" --no-save --ignore-scripts playwright@1.56.1
          # GitHub-hosted Ubuntu already includes Chromium runtime libraries; --with-deps
          # also refreshes the Microsoft APT source, which can transiently return 403.
          if [[ "${{ github.server_url }}" == "https://github.com" ]]; then
            "$browser_tools/node_modules/.bin/playwright" install chromium
          else
            "$browser_tools/node_modules/.bin/playwright" install --with-deps chromium
          fi

      - name: Browser smoke test about and software updates
        if: ${{ needs.changes.outputs.frontend_about == 'true' }}
        shell: bash
        run: PLAYWRIGHT_PACKAGE_ROOT="$RUNNER_TEMP/anyflows-playwright" node tools/ci/frontend-about-smoke.mjs '${{ matrix.frontend }}'

      - name: Browser smoke test landing and console navigation
        if: ${{ matrix.frontend == 'web-next' && needs.changes.outputs.frontend_navigation == 'true' }}
        shell: bash
        run: PLAYWRIGHT_PACKAGE_ROOT="$RUNNER_TEMP/anyflows-playwright" node tools/ci/frontend-navigation-smoke.mjs

      - name: Browser smoke test gallery and verification workflows
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          browser_tools="$RUNNER_TEMP/anyflows-playwright"
          PLAYWRIGHT_PACKAGE_ROOT="$browser_tools" node tools/ci/frontend-gallery-smoke.mjs '${{ matrix.frontend }}'
          PLAYWRIGHT_PACKAGE_ROOT="$browser_tools" node tools/ci/frontend-verification-smoke.mjs '${{ matrix.frontend }}'
          PLAYWRIGHT_PACKAGE_ROOT="$browser_tools" node tools/ci/frontend-dashboard-smoke.mjs '${{ matrix.frontend }}'

      - name: Prepare Gitea screenshot uploader
        if: ${{ always() && (needs.changes.outputs.frontend_about == 'true' || (matrix.frontend == 'web-next' && needs.changes.outputs.frontend_navigation == 'true')) && github.server_url != 'https://github.com' }}
        run: |
          set -euo pipefail
          action_path='.ci-actions/gitea-upload-artifact'
          action_sha='62ac910c5d3dfa85c7cb2df15afe2e342b2407c2'
          git init --quiet "$action_path"
          git -C "$action_path" remote add origin https://gitea.com/actions/gitea-upload-artifact.git
          git -C "$action_path" fetch --quiet --no-tags --depth=1 origin "$action_sha"
          git -C "$action_path" checkout --quiet --detach FETCH_HEAD
          test "$(git -C "$action_path" rev-parse HEAD)" = "$action_sha"

      - name: Upload about screenshots on Gitea
        if: ${{ always() && needs.changes.outputs.frontend_about == 'true' && github.server_url != 'https://github.com' }}
        uses: ./.ci-actions/gitea-upload-artifact
        with:
          name: about-screenshots-${{ matrix.frontend }}
          path: ${{ runner.temp }}/about-screenshots-${{ matrix.frontend }}/*.png
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload about screenshots on GitHub
        if: ${{ always() && needs.changes.outputs.frontend_about == 'true' && github.server_url == 'https://github.com' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: about-screenshots-${{ matrix.frontend }}
          path: ${{ runner.temp }}/about-screenshots-${{ matrix.frontend }}/*.png
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload navigation screenshots on Gitea
        if: ${{ always() && matrix.frontend == 'web-next' && needs.changes.outputs.frontend_navigation == 'true' && github.server_url != 'https://github.com' }}
        uses: ./.ci-actions/gitea-upload-artifact
        with:
          name: navigation-screenshots-web-next
          path: ${{ runner.temp }}/navigation-screenshots-web-next/*.png
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload navigation screenshots on GitHub
        if: ${{ always() && matrix.frontend == 'web-next' && needs.changes.outputs.frontend_navigation == 'true' && github.server_url == 'https://github.com' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: navigation-screenshots-web-next
          path: ${{ runner.temp }}/navigation-screenshots-web-next/*.png
          retention-days: 7
          if-no-files-found: ignore

  rust-quality:
    name: Rust quality gates
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # 多代码生成单元降低大型测试 crate 的编译峰值，链接器按需重读符号表以换取更低内存。
      RUSTFLAGS: "-C link-arg=-Wl,--no-keep-memory"
    steps:
      - name: Configure checkout endpoint
        if: ${{ github.server_url != 'https://github.com' && vars.SOURCE_BASE_URL != '' }}
        shell: bash
        env:
          CHECKOUT_SERVER_URL: ${{ github.server_url }}
          CHECKOUT_EXTERNAL_URL: ${{ vars.SOURCE_BASE_URL }}
        run: |
          set -euo pipefail
          git config --global url."${CHECKOUT_EXTERNAL_URL%/}/".insteadOf "${CHECKOUT_SERVER_URL%/}/"

      - name: Check out repository
        shell: bash
        env:
          CHECKOUT_REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}.git
          CHECKOUT_SHA: ${{ github.sha }}
          CHECKOUT_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          auth="$(printf 'x-access-token:%s' "$CHECKOUT_TOKEN" | base64 -w0)"
          git init .
          git remote add origin "$CHECKOUT_REPOSITORY_URL"
          git -c http.extraheader="AUTHORIZATION: basic $auth" fetch --no-tags --depth=1 origin "$CHECKOUT_SHA"
          git checkout --detach FETCH_HEAD

      - name: Ensure Rust toolchain manager
        shell: bash
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup --version

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          toolchain="$(sed -n 's/^channel = \"\(.*\)\"/\1/p' rust-toolchain.toml)"
          test -n "$toolchain"
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt --component clippy
          rustc --version --verbose

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Install dependency audit tool
        uses: taiki-e/install-action@07b4745e0c39a41822af610387492e3e53aa222b # v2.83.4
        with:
          tool: cargo-deny@0.20.2
          fallback: none

      - name: Install workspace test tool
        if: needs.changes.outputs.full == 'true'
        uses: taiki-e/install-action@07b4745e0c39a41822af610387492e3e53aa222b # v2.83.4
        with:
          tool: cargo-nextest@0.9.140
          fallback: none

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Audit dependencies
        run: cargo deny --all-features --locked check advisories bans licenses sources

      - name: Check crate dependency policy
        run: cargo run --locked --package xtask -- check-deps

      - name: Test release scripts
        if: needs.changes.outputs.full == 'true'
        run: bash tools/ci/test-release-scripts.sh

      - name: Check public core export
        if: needs.changes.outputs.full == 'true'
        run: bash tools/ci/test-public-core-export.sh

      - name: Test live provider preflight
        if: needs.changes.outputs.full == 'true'
        run: bash tools/ci/test-live-provider-test.sh

      - name: Test service container runner
        if: needs.changes.outputs.full == 'true'
        run: bash tools/ci/test-container-test-runner.sh

      - name: Check channel capability catalog
        run: cargo run --locked --package xtask -- channel-capabilities check

      - name: Check OpenAPI contract
        run: |
          if cargo run --locked --package xtask -- openapi check; then
            exit 0
          fi
          cargo run --locked --package xtask -- openapi export
          git diff -- web/openapi/openapi.json
          exit 1

      - name: Check development workspace
        if: needs.changes.outputs.full != 'true'
        run: cargo check --workspace --all-targets --all-features --locked

      - name: Run focused Passkey compatibility tests
        if: needs.changes.outputs.rust == 'true' && needs.changes.outputs.full != 'true'
        run: |
          cargo test --locked -p af-admin --lib passkey
          cargo test --locked -p af-db --lib passkey
          cargo test --locked -p af-server --lib passkey_origin

      - name: Run Clippy
        if: needs.changes.outputs.full == 'true'
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Run tests
        if: needs.changes.outputs.full == 'true'
        run: cargo nextest run --workspace --all-features --locked --no-fail-fast

      - name: Run documentation tests
        if: needs.changes.outputs.full == 'true'
        run: cargo test --workspace --all-features --doc --locked

  clickhouse-integration:
    name: ClickHouse integration
    needs: changes
    if: ${{ needs.changes.outputs.full == 'true' && needs.changes.outputs.clickhouse == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      clickhouse:
        image: docker.io/clickhouse/clickhouse-server:25.8.9.20@sha256:8bc7c69999a7391548765753249eb83f3d93d62d6941484a97188d9d0545fac8
        ports:
          - 18123:8123
        env:
          CLICKHOUSE_PASSWORD: anyflows-integration
        options: >-
          --health-cmd "clickhouse-client --password anyflows-integration --query 'SELECT 1'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    steps:
      - name: Configure checkout endpoint
        if: ${{ github.server_url != 'https://github.com' && vars.SOURCE_BASE_URL != '' }}
        shell: bash
        env:
          CHECKOUT_SERVER_URL: ${{ github.server_url }}
          CHECKOUT_EXTERNAL_URL: ${{ vars.SOURCE_BASE_URL }}
        run: |
          set -euo pipefail
          git config --global url."${CHECKOUT_EXTERNAL_URL%/}/".insteadOf "${CHECKOUT_SERVER_URL%/}/"

      - name: Check out repository
        shell: bash
        env:
          CHECKOUT_REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}.git
          CHECKOUT_SHA: ${{ github.sha }}
          CHECKOUT_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          auth="$(printf 'x-access-token:%s' "$CHECKOUT_TOKEN" | base64 -w0)"
          git init .
          git remote add origin "$CHECKOUT_REPOSITORY_URL"
          git -c http.extraheader="AUTHORIZATION: basic $auth" fetch --no-tags --depth=1 origin "$CHECKOUT_SHA"
          git checkout --detach FETCH_HEAD

      - name: Ensure Rust toolchain manager
        shell: bash
        run: bash tools/ci/install-rustup.sh

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          toolchain="$(sed -n 's/^channel = \"\(.*\)\"/\1/p' rust-toolchain.toml)"
          test -n "$toolchain"
          rustup toolchain install "$toolchain" --profile minimal

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Run real ClickHouse integration test on Gitea
        if: ${{ github.server_url != 'https://github.com' }}
        env:
          ANYFLOWS_CLICKHOUSE_INTEGRATION_URL: http://clickhouse:8123
          ANYFLOWS_CLICKHOUSE_INTEGRATION_USERNAME: default
          ANYFLOWS_CLICKHOUSE_INTEGRATION_PASSWORD: anyflows-integration
        run: bash tools/ci/run-clickhouse-integration-test.sh

      - name: Run real ClickHouse integration test on GitHub
        if: ${{ github.server_url == 'https://github.com' }}
        env:
          ANYFLOWS_CLICKHOUSE_INTEGRATION_URL: http://127.0.0.1:18123
          ANYFLOWS_CLICKHOUSE_INTEGRATION_USERNAME: default
          ANYFLOWS_CLICKHOUSE_INTEGRATION_PASSWORD: anyflows-integration
        run: bash tools/ci/run-clickhouse-integration-test.sh

  msrv:
    name: Minimum supported Rust version
    needs: changes
    if: ${{ needs.changes.outputs.full == 'true' && needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Configure checkout endpoint
        if: ${{ github.server_url != 'https://github.com' && vars.SOURCE_BASE_URL != '' }}
        shell: bash
        env:
          CHECKOUT_SERVER_URL: ${{ github.server_url }}
          CHECKOUT_EXTERNAL_URL: ${{ vars.SOURCE_BASE_URL }}
        run: |
          set -euo pipefail
          git config --global url."${CHECKOUT_EXTERNAL_URL%/}/".insteadOf "${CHECKOUT_SERVER_URL%/}/"

      - name: Check out repository
        shell: bash
        env:
          CHECKOUT_REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}.git
          CHECKOUT_SHA: ${{ github.sha }}
          CHECKOUT_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          auth="$(printf 'x-access-token:%s' "$CHECKOUT_TOKEN" | base64 -w0)"
          git init .
          git remote add origin "$CHECKOUT_REPOSITORY_URL"
          git -c http.extraheader="AUTHORIZATION: basic $auth" fetch --no-tags --depth=1 origin "$CHECKOUT_SHA"
          git checkout --detach FETCH_HEAD

      - name: Ensure Rust toolchain manager
        shell: bash
        run: bash tools/ci/install-rustup.sh

      - name: Install MSRV toolchain
        id: msrv
        shell: bash
        run: |
          msrv="$(sed -n 's/^rust-version = \"\(.*\)\"/\1/p' Cargo.toml | head -n 1)"
          test -n "$msrv"
          if [[ "$msrv" =~ ^[0-9]+\.[0-9]+$ ]]; then
            toolchain="${msrv}.0"
          else
            toolchain="$msrv"
          fi
          rustup toolchain install "$toolchain" --profile minimal
          echo "toolchain=$toolchain" >> "$GITHUB_OUTPUT"

      - name: Cache Rust build artifacts
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: v1-rust-msrv-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'crates/**/Cargo.toml', 'tools/**/Cargo.toml') }}
          restore-keys: |
            v1-rust-msrv-${{ runner.os }}-

      - name: Check workspace with MSRV
        shell: bash
        run: cargo +"${{ steps.msrv.outputs.toolchain }}" check --workspace --all-targets --all-features --locked

