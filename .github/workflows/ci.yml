name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]
  workflow_dispatch:
    inputs:
      generate_api:
        description: Generate and commit OpenAPI artifacts
        required: false
        default: "false"


permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  generate-api-artifacts:
    name: Generate API artifacts
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.generate_api == 'true' }}
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Configure external Gitea checkout endpoint
        if: ${{ startsWith(github.server_url, 'http://gitea_cps3:') }}
        shell: bash
        run: |
          set -euo pipefail
          git config --global url."https://gitea.acmecloud.cn/".insteadOf "http://gitea_cps3:3000/"

      - name: Check out repository
        shell: bash
        env:
          CHECKOUT_REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}.git
          CHECKOUT_SHA: ${{ github.sha }}
          CHECKOUT_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          auth="$(printf 'x-access-token:%s' "$CHECKOUT_TOKEN" | base64 -w0)"
          git init .
          git remote add origin "$CHECKOUT_REPOSITORY_URL"
          git -c http.extraheader="AUTHORIZATION: basic $auth" fetch --no-tags --depth=1 origin "$CHECKOUT_SHA"
          git checkout --detach FETCH_HEAD

      - name: Ensure Rust toolchain manager
        shell: bash
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup --version

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          toolchain="$(sed -n 's/^channel = \"\(.*\)\"/\1/p' rust-toolchain.toml)"
          test -n "$toolchain"
          rustup toolchain install "$toolchain" --profile minimal

      - name: Install frontend dependencies
        shell: bash
        run: |
          corepack enable
          corepack pnpm@10.33.0 --dir web install --frozen-lockfile

      - name: Generate and commit API artifacts
        shell: bash
        env:
          PUSH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cargo run --locked --package xtask -- openapi export
          corepack pnpm@10.33.0 --dir web exec openapi-ts --no-log-file
          node web/scripts/normalize-generated-api.mjs
          git config user.name "gitea-actions[bot]"
          git config user.email "gitea-actions[bot]@noreply.acmecloud.cn"
          git add web/openapi/openapi.json web/src/lib/api/generated
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: 同步 OpenAPI 与生成客户端"
          auth="$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 -w0)"
          git -c http.extraheader="AUTHORIZATION: basic $auth" push origin "HEAD:${GITHUB_REF_NAME}"

  changes:
    name: Detect changed components
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      frontend: ${{ steps.paths.outputs.frontend }}
      rust: ${{ steps.paths.outputs.rust }}
      database: ${{ steps.paths.outputs.database }}
      redis: ${{ steps.paths.outputs.redis }}
    steps:
      - name: Configure external Gitea checkout endpoint
        if: ${{ startsWith(github.server_url, 'http://gitea_cps3:') }}
        shell: bash
        run: |
          set -euo pipefail
          git config --global url."https://gitea.acmecloud.cn/".insteadOf "http://gitea_cps3:3000/"

      - name: Detect changed paths
        id: paths
        shell: bash
        env:
          CHECKOUT_REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}.git
          CHECKOUT_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          emit_all() {
            {
              echo "frontend=true"
              echo "rust=true"
              echo "database=true"
              echo "redis=true"
            } >> "$GITHUB_OUTPUT"
          }

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            emit_all
            exit 0
          fi

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base_sha="$PR_BASE_SHA"
            head_sha="$PR_HEAD_SHA"
          else
            base_sha="$PUSH_BEFORE_SHA"
            head_sha="$PUSH_AFTER_SHA"
          fi

          if [[ -z "$base_sha" || -z "$head_sha" || "$base_sha" =~ ^0+$ ]]; then
            emit_all
            exit 0
          fi

          auth="$(printf 'x-access-token:%s' "$CHECKOUT_TOKEN" | base64 -w0)"
          git init .
          git remote add origin "$CHECKOUT_REPOSITORY_URL"
          git -c http.extraheader="AUTHORIZATION: basic $auth" fetch --no-tags --depth=1 origin "$base_sha" "$head_sha"
          git diff --name-only "$base_sha" "$head_sha" > changed-files.txt
          cat changed-files.txt

          if grep -qx '.github/workflows/ci.yml' changed-files.txt; then
            emit_all
            exit 0
          fi

          matches() {
            if grep -Eq "$1" changed-files.txt; then
              echo true
            else
              echo false
            fi
          }

          {
            echo "frontend=$(matches '^(web/)')"
            echo "rust=$(matches '^(crates/|tools/|\.cargo/|Cargo\.(toml|lock)$|rust-toolchain\.toml$|rustfmt\.toml$|clippy\.toml$|deny\.toml$)')"
            echo "database=$(matches '^(crates/af-db/|tools/ci/run-db-migration-test\.sh$|Cargo\.(toml|lock)$|rust-toolchain\.toml$)')"
            echo "redis=$(matches '^(crates/af-cache/|tools/ci/run-cache-redis-test\.sh$|Cargo\.(toml|lock)$|rust-toolchain\.toml$)')"
          } >> "$GITHUB_OUTPUT"

  release-package:
    name: Linux amd64 release package
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Configure external Gitea checkout endpoint
        if: ${{ startsWith(github.server_url, 'http://gitea_cps3:') }}
        shell: bash
        run: |
          set -euo pipefail
          git config --global url."https://gitea.acmecloud.cn/".insteadOf "http://gitea_cps3:3000/"

      - name: Check out repository
        shell: bash
        env:
          CHECKOUT_REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}.git
          CHECKOUT_SHA: ${{ github.sha }}
          CHECKOUT_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          auth="$(printf 'x-access-token:%s' "$CHECKOUT_TOKEN" | base64 -w0)"
          git init .
          git remote add origin "$CHECKOUT_REPOSITORY_URL"
          git -c http.extraheader="AUTHORIZATION: basic $auth" fetch --no-tags --depth=1 origin "$CHECKOUT_SHA"
          git checkout --detach FETCH_HEAD

      - name: Ensure Rust toolchain manager
        shell: bash
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup --version

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          toolchain="$(sed -n 's/^channel = \"\(.*\)\"/\1/p' rust-toolchain.toml)"
          test -n "$toolchain"
          rustup toolchain install "$toolchain" --profile minimal
          rustc --version --verbose

      - name: Install frontend dependencies
        shell: bash
        run: |
          corepack enable
          corepack pnpm@10.33.0 --dir web install --frozen-lockfile

      - name: Build frontend
        run: corepack pnpm@10.33.0 --dir web build

      - name: Build release binary
        run: |
          cargo build --release --locked --package af-server

      - name: Package and verify release archive
        shell: bash
        run: |
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          bash tools/ci/package-release.sh auto amd64
          archive="$(find release -maxdepth 1 -type f -name 'anyflows-v*-linux-amd64.tar.gz' -print -quit)"
          test -n "$archive"
          test -s "$archive"
          test -s "$archive.sha256"

  frontend-quality:
    name: Frontend quality gates
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Configure external Gitea checkout endpoint
        if: ${{ startsWith(github.server_url, 'http://gitea_cps3:') }}
        shell: bash
        run: |
          set -euo pipefail
          git config --global url."https://gitea.acmecloud.cn/".insteadOf "http://gitea_cps3:3000/"

      - name: Check out repository
        shell: bash
        env:
          CHECKOUT_REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}.git
          CHECKOUT_SHA: ${{ github.sha }}
          CHECKOUT_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          auth="$(printf 'x-access-token:%s' "$CHECKOUT_TOKEN" | base64 -w0)"
          git init .
          git remote add origin "$CHECKOUT_REPOSITORY_URL"
          git -c http.extraheader="AUTHORIZATION: basic $auth" fetch --no-tags --depth=1 origin "$CHECKOUT_SHA"
          git checkout --detach FETCH_HEAD

      - name: Install frontend dependencies
        shell: bash
        run: |
          corepack enable
          corepack pnpm@10.33.0 --dir web install --frozen-lockfile

      - name: Lint frontend
        run: corepack pnpm@10.33.0 --dir web lint

      - name: Build frontend
        run: corepack pnpm@10.33.0 --dir web build

  rust-quality:
    name: Rust quality gates
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Configure external Gitea checkout endpoint
        if: ${{ startsWith(github.server_url, 'http://gitea_cps3:') }}
        shell: bash
        run: |
          set -euo pipefail
          git config --global url."https://gitea.acmecloud.cn/".insteadOf "http://gitea_cps3:3000/"

      - name: Check out repository
        shell: bash
        env:
          CHECKOUT_REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}.git
          CHECKOUT_SHA: ${{ github.sha }}
          CHECKOUT_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          auth="$(printf 'x-access-token:%s' "$CHECKOUT_TOKEN" | base64 -w0)"
          git init .
          git remote add origin "$CHECKOUT_REPOSITORY_URL"
          git -c http.extraheader="AUTHORIZATION: basic $auth" fetch --no-tags --depth=1 origin "$CHECKOUT_SHA"
          git checkout --detach FETCH_HEAD

      - name: Ensure Rust toolchain manager
        shell: bash
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup --version

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          toolchain="$(sed -n 's/^channel = \"\(.*\)\"/\1/p' rust-toolchain.toml)"
          test -n "$toolchain"
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt --component clippy
          rustc --version --verbose

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Install workspace tools
        uses: taiki-e/install-action@07b4745e0c39a41822af610387492e3e53aa222b # v2.83.4
        with:
          tool: cargo-nextest@0.9.140,cargo-deny@0.20.2
          fallback: none

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check crate dependency policy
        run: cargo run --locked --package xtask -- check-deps

      - name: Test release scripts
        run: bash tools/ci/test-release-scripts.sh

      - name: Test service container runner
        run: bash tools/ci/test-container-test-runner.sh

      - name: Check OpenAPI contract
        run: cargo run --locked --package xtask -- openapi check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Run tests
        run: cargo nextest run --workspace --all-features --locked --no-fail-fast

      - name: Run documentation tests
        run: cargo test --workspace --all-features --doc --locked

      - name: Audit dependencies
        run: cargo deny --all-features --locked check advisories bans licenses sources

  msrv:
    name: Minimum supported Rust version
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Configure external Gitea checkout endpoint
        if: ${{ startsWith(github.server_url, 'http://gitea_cps3:') }}
        shell: bash
        run: |
          set -euo pipefail
          git config --global url."https://gitea.acmecloud.cn/".insteadOf "http://gitea_cps3:3000/"

      - name: Check out repository
        shell: bash
        env:
          CHECKOUT_REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}.git
          CHECKOUT_SHA: ${{ github.sha }}
          CHECKOUT_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          auth="$(printf 'x-access-token:%s' "$CHECKOUT_TOKEN" | base64 -w0)"
          git init .
          git remote add origin "$CHECKOUT_REPOSITORY_URL"
          git -c http.extraheader="AUTHORIZATION: basic $auth" fetch --no-tags --depth=1 origin "$CHECKOUT_SHA"
          git checkout --detach FETCH_HEAD

      - name: Ensure Rust toolchain manager
        shell: bash
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup --version

      - name: Install MSRV toolchain
        id: msrv
        shell: bash
        run: |
          msrv="$(sed -n 's/^rust-version = \"\(.*\)\"/\1/p' Cargo.toml | head -n 1)"
          test -n "$msrv"
          if [[ "$msrv" =~ ^[0-9]+\.[0-9]+$ ]]; then
            toolchain="${msrv}.0"
          else
            toolchain="$msrv"
          fi
          rustup toolchain install "$toolchain" --profile minimal
          echo "toolchain=$toolchain" >> "$GITHUB_OUTPUT"

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: msrv

      - name: Check workspace with MSRV
        shell: bash
        run: cargo +"${{ steps.msrv.outputs.toolchain }}" check --workspace --all-targets --all-features --locked

  sqlite-migration:
    name: SQLite migration smoke test
    needs: changes
    if: ${{ needs.changes.outputs.database == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Configure external Gitea checkout endpoint
        if: ${{ startsWith(github.server_url, 'http://gitea_cps3:') }}
        shell: bash
        run: |
          set -euo pipefail
          git config --global url."https://gitea.acmecloud.cn/".insteadOf "http://gitea_cps3:3000/"

      - name: Check out repository
        shell: bash
        env:
          CHECKOUT_REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}.git
          CHECKOUT_SHA: ${{ github.sha }}
          CHECKOUT_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          auth="$(printf 'x-access-token:%s' "$CHECKOUT_TOKEN" | base64 -w0)"
          git init .
          git remote add origin "$CHECKOUT_REPOSITORY_URL"
          git -c http.extraheader="AUTHORIZATION: basic $auth" fetch --no-tags --depth=1 origin "$CHECKOUT_SHA"
          git checkout --detach FETCH_HEAD

      - name: Ensure Rust toolchain manager
        shell: bash
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup --version

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          toolchain="$(sed -n 's/^channel = \"\(.*\)\"/\1/p' rust-toolchain.toml)"
          test -n "$toolchain"
          rustup toolchain install "$toolchain" --profile minimal

      - name: Cache database test artifacts
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: database-sqlite

      - name: Run SQLite migration smoke test
        env:
          AF_TEST_DATABASE_URL: "sqlite::memory:"
          AF_REQUIRE_LIVE_DATABASE: "1"
          AF_ALLOW_DESTRUCTIVE_MIGRATION_TEST: "1"
        run: bash tools/ci/run-db-migration-test.sh sqlite

  postgres-migration:
    name: PostgreSQL migration smoke test
    needs: changes
    if: ${{ needs.changes.outputs.database == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.10-bookworm
        env:
          POSTGRES_USER: anyflows
          POSTGRES_PASSWORD: anyflows_ci
          POSTGRES_DB: anyflows_migration_test_ci
        ports:
          - 15432:5432
        options: >-
          --health-cmd "pg_isready -U anyflows -d anyflows_migration_test_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    steps:
      - name: Configure external Gitea checkout endpoint
        if: ${{ startsWith(github.server_url, 'http://gitea_cps3:') }}
        shell: bash
        run: |
          set -euo pipefail
          git config --global url."https://gitea.acmecloud.cn/".insteadOf "http://gitea_cps3:3000/"

      - name: Check out repository
        shell: bash
        env:
          CHECKOUT_REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}.git
          CHECKOUT_SHA: ${{ github.sha }}
          CHECKOUT_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          auth="$(printf 'x-access-token:%s' "$CHECKOUT_TOKEN" | base64 -w0)"
          git init .
          git remote add origin "$CHECKOUT_REPOSITORY_URL"
          git -c http.extraheader="AUTHORIZATION: basic $auth" fetch --no-tags --depth=1 origin "$CHECKOUT_SHA"
          git checkout --detach FETCH_HEAD

      - name: Ensure Rust toolchain manager
        shell: bash
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup --version

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          toolchain="$(sed -n 's/^channel = \"\(.*\)\"/\1/p' rust-toolchain.toml)"
          test -n "$toolchain"
          rustup toolchain install "$toolchain" --profile minimal

      - name: Cache database test artifacts
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: database-postgres

      - name: Run PostgreSQL migration smoke test on Gitea
        if: ${{ github.server_url != 'https://github.com' }}
        env:
          AF_TEST_DATABASE_URL: postgres://anyflows:anyflows_ci@postgres:5432/anyflows_migration_test_ci
          AF_REQUIRE_LIVE_DATABASE: "1"
          AF_ALLOW_DESTRUCTIVE_MIGRATION_TEST: "1"
        run: bash tools/ci/run-db-migration-test.sh postgres

      - name: Run PostgreSQL migration smoke test on GitHub
        if: ${{ github.server_url == 'https://github.com' }}
        env:
          AF_TEST_DATABASE_URL: postgres://anyflows:anyflows_ci@127.0.0.1:15432/anyflows_migration_test_ci
          AF_REQUIRE_LIVE_DATABASE: "1"
          AF_ALLOW_DESTRUCTIVE_MIGRATION_TEST: "1"
        run: bash tools/ci/run-db-migration-test.sh postgres

  mysql-migration:
    name: MySQL migration smoke test
    needs: changes
    if: ${{ needs.changes.outputs.database == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4.10@sha256:6ec1dc148edc412cce3ae27dd5b78dcd4e026976648424b3d31d9a8c6204db4e
        env:
          MYSQL_USER: anyflows
          MYSQL_PASSWORD: anyflows_ci
          MYSQL_ROOT_PASSWORD: root_ci
          MYSQL_DATABASE: anyflows_migration_test_ci
        ports:
          - 13306:3306
        options: >-
          --health-cmd "mysql --protocol=tcp -h 127.0.0.1 -u root -proot_ci -e 'SET GLOBAL log_bin_trust_function_creators = 1; SELECT 1'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
