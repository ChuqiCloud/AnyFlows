name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  rust-quality:
    name: Rust quality gates
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install rustup when missing from runner image
        shell: bash
        run: bash tools/ci/install-rustup.sh

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          toolchain="$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)"
          test -n "$toolchain"
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt --component clippy
          rustc --version --verbose

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Install workspace tools
        uses: taiki-e/install-action@07b4745e0c39a41822af610387492e3e53aa222b # v2.83.4
        with:
          tool: cargo-nextest@0.9.140,cargo-deny@0.20.2
          fallback: none

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check crate dependency policy
        run: cargo run --locked --package xtask -- check-deps

      - name: Test release scripts
        run: bash tools/ci/test-release-scripts.sh

      - name: 测试服务容器运行脚本
        run: bash tools/ci/test-container-test-runner.sh

      - name: Check OpenAPI contract
        run: cargo run --locked --package xtask -- openapi check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Run tests
        run: cargo nextest run --workspace --all-features --locked

      - name: Run documentation tests
        run: cargo test --workspace --all-features --doc --locked

      - name: Audit dependencies
        run: cargo deny --all-features --locked check advisories bans licenses sources

  msrv:
    name: Minimum supported Rust version
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install rustup when missing from runner image
        shell: bash
        run: bash tools/ci/install-rustup.sh

      - name: Install MSRV toolchain
        id: msrv
        shell: bash
        run: |
          msrv="$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)"
          test -n "$msrv"
          if [[ "$msrv" =~ ^[0-9]+\.[0-9]+$ ]]; then
            toolchain="${msrv}.0"
          else
            toolchain="$msrv"
          fi
          rustup toolchain install "$toolchain" --profile minimal
          echo "toolchain=$toolchain" >> "$GITHUB_OUTPUT"

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: msrv

      - name: Check workspace with MSRV
        shell: bash
        run: |
          toolchain="${{ steps.msrv.outputs.toolchain }}"
          cargo +"$toolchain" check --workspace --all-targets --all-features --locked

  database-migrations:
    name: Database migrations (${{ matrix.dialect }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - dialect: sqlite
            database_url: "sqlite::memory:"
            service_image: redis:8.2.7-bookworm@sha256:d30960f73a599496d8b2802c97758bab6b1cd421fd06337f837779c47a57e1f3
            service_options: >-
              --health-cmd "redis-cli ping"
              --health-interval 5s
              --health-timeout 5s
              --health-retries 30
          - dialect: postgres
            database_url: postgres://anyflows:anyflows_ci@database:5432/anyflows_migration_test_ci
            service_image: postgres:17.10-bookworm@sha256:67870dc097790edf2bd6726658db995dcc830f799d41bb2b78ef07c9a2d5f010
            service_options: >-
              --health-cmd "pg_isready -U anyflows -d anyflows_migration_test_ci"
              --health-interval 5s
              --health-timeout 5s
              --health-retries 30
          - dialect: mysql
            database_url: mysql://anyflows:anyflows_ci@database:3306/anyflows_migration_test_ci?timezone=%2B08:00
            service_image: mysql:8.4.10@sha256:6ec1dc148edc412cce3ae27dd5b78dcd4e026976648424b3d31d9a8c6204db4e
            service_options: >-
              --health-cmd "mysqladmin ping -h 127.0.0.1 -u root -proot_ci --silent"
              --health-interval 5s
              --health-timeout 5s
              --health-retries 30
    services:
      database:
        image: ${{ matrix.service_image }}
        env:
          POSTGRES_USER: anyflows
          POSTGRES_PASSWORD: anyflows_ci
          POSTGRES_DB: anyflows_migration_test_ci
          MYSQL_USER: anyflows
          MYSQL_PASSWORD: anyflows_ci
          MYSQL_ROOT_PASSWORD: root_ci
          MYSQL_DATABASE: anyflows_migration_test_ci
        options: ${{ matrix.service_options }}
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install rustup when missing from runner image
        shell: bash
        run: bash tools/ci/install-rustup.sh

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          toolchain="$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)"
          test -n "$toolchain"
          rustup toolchain install "$toolchain" --profile minimal

      - name: Cache database test artifacts
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: database-${{ matrix.dialect }}

      - name: Run migration smoke test
        env:
          AF_TEST_DATABASE_URL: ${{ matrix.database_url }}
          AF_REQUIRE_LIVE_DATABASE: "1"
        run: bash tools/ci/run-db-migration-test.sh "${{ matrix.dialect }}"

  cache-redis:
    name: Redis cache smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      redis:
        image: redis:8.2.7-bookworm@sha256:d30960f73a599496d8b2802c97758bab6b1cd421fd06337f837779c47a57e1f3
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install rustup when missing from runner image
        shell: bash
        run: bash tools/ci/install-rustup.sh

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          toolchain="$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)"
          test -n "$toolchain"
          rustup toolchain install "$toolchain" --profile minimal

      - name: Cache Redis test artifacts
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: cache-redis

      - name: Run Redis cache smoke test
        env:
          AF_TEST_REDIS_URL: redis://redis:6379/
        run: bash tools/ci/run-cache-redis-test.sh
