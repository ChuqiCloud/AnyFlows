name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  release-package:
    name: Linux amd64 release package
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Configure external Gitea checkout endpoint
        if: ${{ startsWith(github.server_url, 'http://gitea_cps3:') }}
        shell: bash
        env:
          GITEA_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          auth="$(printf 'x-access-token:%s' "$GITEA_TOKEN" | base64 -w0)"
          git config --global url."https://gitea.acmecloud.cn/".insteadOf "http://gitea_cps3:3000/"
          git config --global http.https://gitea.acmecloud.cn/.extraheader "AUTHORIZATION: basic $auth"

      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Ensure Rust toolchain manager
        shell: bash
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup --version

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          toolchain="$(sed -n 's/^channel = \"\(.*\)\"/\1/p' rust-toolchain.toml)"
          test -n "$toolchain"
          rustup toolchain install "$toolchain" --profile minimal
          rustc --version --verbose

      - name: Install frontend dependencies
        shell: bash
        run: |
          corepack enable
          corepack pnpm@10.33.0 --dir web install --frozen-lockfile

      - name: Build frontend
        run: corepack pnpm@10.33.0 --dir web build

      - name: Build release binary
        run: |
          cargo build --release --locked --package af-server

      - name: Package and verify release archive
        shell: bash
        run: |
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          bash tools/ci/package-release.sh auto amd64
          archive="$(find release -maxdepth 1 -type f -name 'anyflows-v*-linux-amd64.tar.gz' -print -quit)"
          test -n "$archive"
          test -s "$archive"
          test -s "$archive.sha256"

  frontend-quality:
    name: Frontend quality gates
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Configure external Gitea checkout endpoint
        if: ${{ startsWith(github.server_url, 'http://gitea_cps3:') }}
        shell: bash
        env:
          GITEA_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          auth="$(printf 'x-access-token:%s' "$GITEA_TOKEN" | base64 -w0)"
          git config --global url."https://gitea.acmecloud.cn/".insteadOf "http://gitea_cps3:3000/"
          git config --global http.https://gitea.acmecloud.cn/.extraheader "AUTHORIZATION: basic $auth"

      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install frontend dependencies
        shell: bash
        run: |
          corepack enable
          corepack pnpm@10.33.0 --dir web install --frozen-lockfile

      - name: Lint frontend
        run: corepack pnpm@10.33.0 --dir web lint

      - name: Build frontend
        run: corepack pnpm@10.33.0 --dir web build

  rust-quality:
    name: Rust quality gates
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Configure external Gitea checkout endpoint
        if: ${{ startsWith(github.server_url, 'http://gitea_cps3:') }}
        shell: bash
        env:
          GITEA_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          auth="$(printf 'x-access-token:%s' "$GITEA_TOKEN" | base64 -w0)"
          git config --global url."https://gitea.acmecloud.cn/".insteadOf "http://gitea_cps3:3000/"
          git config --global http.https://gitea.acmecloud.cn/.extraheader "AUTHORIZATION: basic $auth"

      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Ensure Rust toolchain manager
        shell: bash
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup --version

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          toolchain="$(sed -n 's/^channel = \"\(.*\)\"/\1/p' rust-toolchain.toml)"
          test -n "$toolchain"
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt --component clippy
          rustc --version --verbose

      - name: Cache Rust build artifacts
        if: ${{ !startsWith(github.server_url, 'http://gitea_cps3:') }}
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Install workspace tools
        uses: taiki-e/install-action@07b4745e0c39a41822af610387492e3e53aa222b # v2.83.4
        with:
          tool: cargo-nextest@0.9.140,cargo-deny@0.20.2
          fallback: none

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check crate dependency policy
        run: cargo run --locked --package xtask -- check-deps

      - name: Test release scripts
        run: bash tools/ci/test-release-scripts.sh

      - name: Test service container runner
        run: bash tools/ci/test-container-test-runner.sh

      - name: Check OpenAPI contract
        run: cargo run --locked --package xtask -- openapi check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Run tests
        run: cargo nextest run --workspace --all-features --locked

      - name: Run documentation tests
        run: cargo test --workspace --all-features --doc --locked

      - name: Audit dependencies
        run: cargo deny --all-features --locked check advisories bans licenses sources

  msrv:
    name: Minimum supported Rust version
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Configure external Gitea checkout endpoint
        if: ${{ startsWith(github.server_url, 'http://gitea_cps3:') }}
        shell: bash
        env:
          GITEA_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          auth="$(printf 'x-access-token:%s' "$GITEA_TOKEN" | base64 -w0)"
          git config --global url."https://gitea.acmecloud.cn/".insteadOf "http://gitea_cps3:3000/"
          git config --global http.https://gitea.acmecloud.cn/.extraheader "AUTHORIZATION: basic $auth"

      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Ensure Rust toolchain manager
        shell: bash
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup --version

      - name: Install MSRV toolchain
        id: msrv
        shell: bash
        run: |
          msrv="$(sed -n 's/^rust-version = \"\(.*\)\"/\1/p' Cargo.toml | head -n 1)"
          test -n "$msrv"
          if [[ "$msrv" =~ ^[0-9]+\.[0-9]+$ ]]; then
            toolchain="${msrv}.0"
          else
            toolchain="$msrv"
          fi
          rustup toolchain install "$toolchain" --profile minimal
          echo "toolchain=$toolchain" >> "$GITHUB_OUTPUT"

      - name: Cache Rust build artifacts
        if: ${{ !startsWith(github.server_url, 'http://gitea_cps3:') }}
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: msrv

      - name: Check workspace with MSRV
        shell: bash
        run: cargo +"${{ steps.msrv.outputs.toolchain }}" check --workspace --all-targets --all-features --locked

  sqlite-migration:
    name: SQLite migration smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Configure external Gitea checkout endpoint
        if: ${{ startsWith(github.server_url, 'http://gitea_cps3:') }}
        shell: bash
        env:
          GITEA_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          auth="$(printf 'x-access-token:%s' "$GITEA_TOKEN" | base64 -w0)"
          git config --global url."https://gitea.acmecloud.cn/".insteadOf "http://gitea_cps3:3000/"
          git config --global http.https://gitea.acmecloud.cn/.extraheader "AUTHORIZATION: basic $auth"

      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Ensure Rust toolchain manager
        shell: bash
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup --version

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          toolchain="$(sed -n 's/^channel = \"\(.*\)\"/\1/p' rust-toolchain.toml)"
          test -n "$toolchain"
          rustup toolchain install "$toolchain" --profile minimal

      - name: Cache database test artifacts
        if: ${{ !startsWith(github.server_url, 'http://gitea_cps3:') }}
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: database-sqlite

      - name: Run SQLite migration smoke test
        env:
          AF_TEST_DATABASE_URL: "sqlite::memory:"
          AF_REQUIRE_LIVE_DATABASE: "1"
          AF_ALLOW_DESTRUCTIVE_MIGRATION_TEST: "1"
        run: bash tools/ci/run-db-migration-test.sh sqlite

  postgres-migration:
    name: PostgreSQL migration smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.10-bookworm@sha256:67870dd097790edf2bd6726658db995dcc830f799d41bb2b78ef07c9a2d5f010
        env:
          POSTGRES_USER: anyflows
          POSTGRES_PASSWORD: anyflows_ci
          POSTGRES_DB: anyflows_migration_test_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U anyflows -d anyflows_migration_test_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    steps:
      - name: Configure external Gitea checkout endpoint
        if: ${{ startsWith(github.server_url, 'http://gitea_cps3:') }}
        shell: bash
        env:
          GITEA_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          auth="$(printf 'x-access-token:%s' "$GITEA_TOKEN" | base64 -w0)"
          git config --global url."https://gitea.acmecloud.cn/".insteadOf "http://gitea_cps3:3000/"
          git config --global http.https://gitea.acmecloud.cn/.extraheader "AUTHORIZATION: basic $auth"

      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Ensure Rust toolchain manager
        shell: bash
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup --version

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          toolchain="$(sed -n 's/^channel = \"\(.*\)\"/\1/p' rust-toolchain.toml)"
          test -n "$toolchain"
          rustup toolchain install "$toolchain" --profile minimal

      - name: Cache database test artifacts
        if: ${{ !startsWith(github.server_url, 'http://gitea_cps3:') }}
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: database-postgres

      - name: Run PostgreSQL migration smoke test
        env:
          AF_TEST_DATABASE_URL: postgres://anyflows:anyflows_ci@127.0.0.1:5432/anyflows_migration_test_ci
          AF_REQUIRE_LIVE_DATABASE: "1"
          AF_ALLOW_DESTRUCTIVE_MIGRATION_TEST: "1"
        run: bash tools/ci/run-db-migration-test.sh postgres

  mysql-migration:
    name: MySQL migration smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4.10@sha256:6ec1dc148edc412cce3ae27dd5b78dcd4e026976648424b3d31d9a8c6204db4e
        env:
          MYSQL_USER: anyflows
          MYSQL_PASSWORD: anyflows_ci
          MYSQL_ROOT_PASSWORD: root_ci
          MYSQL_DATABASE: anyflows_migration_test_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -u root -proot_ci --silent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    steps:
      - name: Configure external Gitea checkout endpoint
        if: ${{ startsWith(github.server_url, 'http://gitea_cps3:') }}
        shell: bash
        env:
          GITEA_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          auth="$(printf 'x-access-token:%s' "$GITEA_TOKEN" | base64 -w0)"
          git config --global url."https://gitea.acmecloud.cn/".insteadOf "http://gitea_cps3:3000/"
          git config --global http.https://gitea.acmecloud.cn/.extraheader "AUTHORIZATION: basic $auth"

      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Ensure Rust toolchain manager
        shell: bash
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup --version

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          toolchain="$(sed -n 's/^channel = \"\(.*\)\"/\1/p' rust-toolchain.toml)"
          test -n "$toolchain"
          rustup toolchain install "$toolchain" --profile minimal

      - name: Cache database test artifacts
        if: ${{ !startsWith(github.server_url, 'http://gitea_cps3:') }}
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: database-mysql

      - name: Run MySQL migration smoke test
        env:
          AF_TEST_DATABASE_URL: mysql://anyflows:anyflows_ci@127.0.0.1:3306/anyflows_migration_test_ci?timezone=%2B08:00
          AF_REQUIRE_LIVE_DATABASE: "1"
          AF_ALLOW_DESTRUCTIVE_MIGRATION_TEST: "1"
        run: bash tools/ci/run-db-migration-test.sh mysql

  cache-redis:
    name: Redis cache smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      redis:
        image: redis:8.2.7-bookworm@sha256:d30960f73a599496d8b2802c97758bab6b1cd421fd06337f837779c47a57e1f3
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    steps:
      - name: Configure external Gitea checkout endpoint
        if: ${{ startsWith(github.server_url, 'http://gitea_cps3:') }}
        shell: bash
        env:
          GITEA_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          auth="$(printf 'x-access-token:%s' "$GITEA_TOKEN" | base64 -w0)"
          git config --global url."https://gitea.acmecloud.cn/".insteadOf "http://gitea_cps3:3000/"
          git config --global http.https://gitea.acmecloud.cn/.extraheader "AUTHORIZATION: basic $auth"

      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Ensure Rust toolchain manager
        shell: bash
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup --version

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          toolchain="$(sed -n 's/^channel = \"\(.*\)\"/\1/p' rust-toolchain.toml)"
          test -n "$toolchain"
          rustup toolchain install "$toolchain" --profile minimal

      - name: Cache Redis test artifacts
        if: ${{ !startsWith(github.server_url, 'http://gitea_cps3:') }}
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: cache-redis

      - name: Run Redis cache smoke test
        env:
          AF_TEST_REDIS_URL: redis://127.0.0.1:6379/
          AF_REQUIRE_LIVE_REDIS: "1"
        run: bash tools/ci/run-cache-redis-test.sh
