name: Mirror Gitea PR discussion

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, closed]
  issue_comment:
    types: [created, edited, deleted]
  workflow_dispatch:
    inputs:
      pr:
        description: Gitea PR 编号
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: gitea-pr-discussion-${{ github.event.pull_request.number || github.event.issue.number || inputs.pr }}
  cancel-in-progress: false

jobs:
  mirror:
    if: >-
      github.repository == 'acmecloud/AnyFlows' &&
      (github.event_name == 'pull_request' ||
       (github.event_name == 'issue_comment' && github.event.issue.pull_request != null) ||
       github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITEA_API_BASE: https://gitea.acmecloud.cn/api/v1
      GITEA_REPOSITORY: acmecloud/AnyFlows
      GITEA_API_TOKEN: ${{ github.token }}
      GITHUB_PUBLIC_REPOSITORY: ChuqiCloud/AnyFlows
      GITHUB_API_URL: https://api.github.com
      GITHUB_TOKEN: ${{ secrets.PUBLIC_REPO_SYNC_TOKEN }}
      GITEA_PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number || inputs.pr }}
    steps:
      - name: Check out synchronization tools
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: tools/repository

      - name: Validate synchronization credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GITHUB_TOKEN" || {
            echo 'PUBLIC_REPO_SYNC_TOKEN is not configured' >&2
            exit 1
          }
          [[ "$GITEA_PR_NUMBER" =~ ^[1-9][0-9]*$ ]] || {
            echo 'Gitea PR number is invalid' >&2
            exit 1
          }

      - name: Mirror Gitea PR discussion to GitHub
        shell: bash
        env:
          SYNC_METADATA: ${{ github.event_name == 'pull_request' && '--sync-metadata' || '' }}
        run: |
          set -euo pipefail
          python3 tools/repository/sync-gitea-pr-comments.py \
            --pr "$GITEA_PR_NUMBER" $SYNC_METADATA
