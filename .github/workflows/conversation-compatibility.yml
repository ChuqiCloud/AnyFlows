name: Conversation compatibility

on:
  pull_request:
    branches: [develop]
    paths:
      - 'crates/af-protocol/**'
      - 'crates/af-relay/**'
      - 'crates/af-domain/src/client_profile.rs'
      - 'crates/af-adapter/src/client_profile.rs'
      - 'crates/af-adapter/src/opencode.rs'
      - 'crates/af-adapter/src/nvidia.rs'
      - 'crates/af-adapter/src/factory.rs'
      - 'crates/af-adapter/src/context.rs'
      - 'crates/af-cache/src/sticky.rs'
      - 'crates/af-cache/tests/redis_integration.rs'
      - 'crates/af-db/src/opencode_settings.rs'
      - 'crates/af-server/src/model_discovery.rs'
      - 'crates/af-server/src/channel_probe.rs'
      - 'crates/af-server/src/sticky_session.rs'
      - 'crates/af-admin/src/client_profiles.rs'
      - 'crates/af-db/src/client_profiles*'
      - 'crates/af-db/src/entity/*client_profile*'
      - 'crates/af-db/src/scheduler_runtime/**'
      - 'crates/af-db/src/migration/*client_profiles*'
      - 'crates/af-http/src/client_profiles.rs'
      - 'crates/af-http/src/openapi/client_profiles.rs'
      - 'crates/af-server/src/scheduled_chat.rs'
      - 'crates/af-server/src/scheduled_chat/**'
      - 'crates/af-server/src/debug_trace_runtime.rs'
      - 'crates/af-server/src/billing_chat.rs'
      - '.github/workflows/conversation-compatibility.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: conversation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: '1'
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  CACHE_ON_FAILURE: 'true'
  RUSTFLAGS: '-C link-arg=-Wl,--no-keep-memory'

jobs:
  conversation:
    name: Conversation protocol and scheduling checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      redis:
        image: redis:8.2.7-bookworm@sha256:d30960f73a599496d8b2802c97758bab6b1cd421fd06337f837779c47a57e1f3
        ports:
          - 6379/tcp
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
    steps:
      - name: Check out repository
        shell: bash
        env:
          CHECKOUT_REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}.git
          CHECKOUT_SHA: ${{ github.sha }}
          CHECKOUT_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repository_url="$CHECKOUT_REPOSITORY_URL"
          if [[ "$repository_url" == http://gitea_cps3:* ]]; then
            repository_url="https://gitea.acmecloud.cn/${{ github.repository }}.git"
          fi
          auth="$(printf 'x-access-token:%s' "$CHECKOUT_TOKEN" | base64 -w0)"
          git init .
          git remote add origin "$repository_url"
          git -c http.extraheader="AUTHORIZATION: basic $auth" fetch --no-tags --depth=1 origin "$CHECKOUT_SHA"
          git checkout --detach FETCH_HEAD

      - name: Install Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if bash tools/ci/install-rustup.sh; then
              break
            fi
            if [[ "$attempt" == 3 ]]; then
              exit 1
            fi
            sleep 3
          done
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"
          toolchain="$(sed -n 's/^channel = \"\(.*\)\"/\1/p' rust-toolchain.toml)"
          test -n "$toolchain"
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt --component clippy

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: conversation

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check affected crates
        run: cargo clippy -p af-protocol -p af-relay -p af-server --all-targets --all-features --locked -- -D warnings

      - name: Test protocol parsing and relay lifecycle
        run: cargo test --quiet -p af-protocol -p af-relay --all-features --locked

      - name: Test conversation scheduling
        run: |
          cargo test --quiet -p af-server --lib --all-features --locked scheduled_chat::
          cargo test --quiet -p af-server --lib --all-features --locked billing_chat::
          cargo test --quiet -p af-server --lib --all-features --locked debug_trace_runtime::

      - name: Test shared client session creation
        env:
          AF_TEST_REDIS_URL: ${{ github.server_url == 'https://github.com' && format('redis://127.0.0.1:{0}/', job.services.redis.ports[6379]) || 'redis://redis:6379/' }}
          AF_REQUIRE_LIVE_REDIS: '1'
        run: |
          cargo test --quiet -p af-cache --lib --locked sticky::
          bash tools/ci/run-cache-redis-test.sh

      - name: Test client profile configuration and runtime snapshots
        run: |
          cargo test --quiet -p af-domain --lib --locked enums_tests::
          cargo test --quiet -p af-account --lib --locked credential_
          cargo test --quiet -p af-db --lib --locked admin_channel_write_tests::
          cargo test --quiet -p af-db --lib --locked credential_state_tests::
          AF_ALLOW_DESTRUCTIVE_MIGRATION_TEST=1 cargo test --quiet -p af-db --lib --locked migration::tests::migration_runner_smoke -- --ignored
          cargo test --quiet -p af-http --lib --locked management_credential_writes::
          cargo test --quiet -p af-domain --lib --locked client_profile::
          cargo test --quiet -p af-adapter --lib --locked client_profile::
          cargo test --quiet -p af-adapter --lib --locked opencode::
          cargo test --quiet -p af-adapter --lib --locked nvidia::
          cargo test --quiet -p af-adapter --lib --locked factory::
          cargo test --quiet -p af-db --lib --locked opencode_settings::
          cargo test --quiet -p af-db --lib --locked credential_probe_tests::
          cargo test --quiet -p af-db --lib --locked model_sync_tests::
          cargo test --quiet -p af-server --lib --all-features --locked sticky_session::
          cargo test --quiet -p af-server --lib --all-features --locked model_discovery::
          cargo test --quiet -p af-server --lib --all-features --locked channel_probe_tests::
          cargo test --quiet -p af-admin --lib --locked client_profiles::
          cargo test --quiet -p af-http --lib --locked client_profiles::
          cargo test --quiet -p af-db --lib --locked client_profiles_tests::
          cargo test --quiet -p af-db --lib --locked scheduler_runtime::
