name: Propose Gitea sync

on:
  pull_request_target:
    types: [closed]
    branches: [main]
  issue_comment:
    types: [created, edited, deleted]

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: gitea-sync-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  propose:
    if: >-
      github.repository == 'ChuqiCloud/AnyFlows' &&
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main' &&
      !startsWith(github.event.pull_request.head.ref, 'sync/gitea-public-core')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GITEA_BASE_URL: https://gitea.acmecloud.cn
      GITEA_REPOSITORY: acmecloud/AnyFlows
      GITEA_TARGET_BRANCH: develop
      GITEA_USERNAME: ${{ secrets.GITEA_SYNC_USERNAME }}
      GITEA_TOKEN: ${{ secrets.GITEA_SYNC_TOKEN }}
      PUBLIC_PR_NUMBER: ${{ github.event.pull_request.number }}
      PUBLIC_PR_URL: ${{ github.event.pull_request.html_url }}
      PUBLIC_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PUBLIC_PATCH_API_URL: ${{ github.api_url }}/repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}
    steps:
      - name: Validate sync credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GITEA_USERNAME" || { echo 'GITEA_SYNC_USERNAME is not configured' >&2; exit 1; }
          test -n "$GITEA_TOKEN" || { echo 'GITEA_SYNC_TOKEN is not configured' >&2; exit 1; }

      - name: Prepare public patch
        id: prepare
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -n "$PUBLIC_PATCH_API_URL" || { echo 'GitHub PR API URL is missing' >&2; exit 1; }
          [[ "$PUBLIC_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo 'GitHub PR head SHA is invalid' >&2
            exit 1
          }
          curl --fail --silent --show-error --location --retry 3 --retry-all-errors \
            --retry-delay 5 --connect-timeout 10 --max-time 60 \
            -H 'Accept: application/vnd.github.patch' \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$PUBLIC_PATCH_API_URL" > "$RUNNER_TEMP/public-core.patch"
          grep -q '^diff --git ' "$RUNNER_TEMP/public-core.patch" || {
            echo 'GitHub PR patch does not contain a file diff' >&2
            exit 1
          }
          if grep -Eq '^(diff --git |--- |\+\+\+ ).*docs/public-core-source\.json' \
            "$RUNNER_TEMP/public-core.patch"; then
            echo 'Public source metadata is generated and must not be changed in a public PR.' >&2
            exit 1
          fi

          metadata="$RUNNER_TEMP/source-pr-metadata.json"
          jq -n --arg title "同步 GitHub 公共核心变更 #$PUBLIC_PR_NUMBER" \
            --arg url "$PUBLIC_PR_URL" '{title: $title, body: "", url: $url}' > "$metadata"
          if source_pr="$(curl --fail --silent --show-error --connect-timeout 5 --max-time 15 \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$PUBLIC_PATCH_API_URL")" &&
            jq -e --argjson number "$PUBLIC_PR_NUMBER" '
              select(type == "object" and .number == $number) |
              select((.title | type == "string" and length > 0) and
                (.body == null or (.body | type == "string")) and
                (.html_url | type == "string" and length > 0)) |
              {title: .title, body: (.body // ""), url: .html_url}' \
              <<<"$source_pr" > "$metadata.tmp"; then
            mv "$metadata.tmp" "$metadata"
          else
            rm -f "$metadata.tmp"
            echo "::warning::Source GitHub PR #$PUBLIC_PR_NUMBER metadata is unavailable; using the default sync title and description."
          fi
          echo 'has_changes=true' >> "$GITHUB_OUTPUT"

      - name: Check out Gitea develop
        if: ${{ steps.prepare.outputs.has_changes == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/gitea-askpass" <<'EOF'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s' "$GITEA_USERNAME" ;;
            *) printf '%s' "$GITEA_TOKEN" ;;
          esac
          EOF
          chmod 700 "$RUNNER_TEMP/gitea-askpass"
          export GIT_ASKPASS="$RUNNER_TEMP/gitea-askpass"
          export GIT_TERMINAL_PROMPT=0
          git clone --quiet --branch "$GITEA_TARGET_BRANCH" --single-branch \
            "$GITEA_BASE_URL/$GITEA_REPOSITORY.git" gitea-source
          rm -f "$RUNNER_TEMP/gitea-askpass"

      - name: Apply public contribution
        id: apply
        if: ${{ steps.prepare.outputs.has_changes == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          sync_branch="sync/github-pr-${PUBLIC_PR_NUMBER}-${PUBLIC_HEAD_SHA}"
          cat > "$RUNNER_TEMP/gitea-askpass" <<'EOF'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s' "$GITEA_USERNAME" ;;
            *) printf '%s' "$GITEA_TOKEN" ;;
          esac
          EOF
          chmod 700 "$RUNNER_TEMP/gitea-askpass"
          export GIT_ASKPASS="$RUNNER_TEMP/gitea-askpass"
          export GIT_TERMINAL_PROMPT=0
          if git -C gitea-source ls-remote --exit-code origin "refs/heads/$sync_branch" >/dev/null 2>&1; then
            echo "Reusing existing Gitea branch $sync_branch"
            echo 'has_changes=true' >> "$GITHUB_OUTPUT"
            echo 'needs_push=false' >> "$GITHUB_OUTPUT"
            echo "sync_branch=$sync_branch" >> "$GITHUB_OUTPUT"
            rm -f "$RUNNER_TEMP/gitea-askpass"
            exit 0
          fi
          git -C gitea-source checkout -q -b "$sync_branch"
          if ! git -C gitea-source apply --3way --whitespace=nowarn "$RUNNER_TEMP/public-core.patch"; then
            echo 'The public contribution cannot be applied cleanly to Gitea develop.' >&2
            rm -f "$RUNNER_TEMP/gitea-askpass"
            exit 1
          fi
          git -C gitea-source config user.name 'github-sync[bot]'
          git -C gitea-source config user.email 'github-sync[bot]@users.noreply.github.com'
          git -C gitea-source add -A
          if git -C gitea-source diff --cached --quiet; then
            echo 'has_changes=false' >> "$GITHUB_OUTPUT"
            rm -f "$RUNNER_TEMP/gitea-askpass"
            exit 0
          fi
          git -C gitea-source commit -q -m "sync: apply GitHub PR #$PUBLIC_PR_NUMBER"
          rm -f "$RUNNER_TEMP/gitea-askpass"
          echo 'has_changes=true' >> "$GITHUB_OUTPUT"
          echo 'needs_push=true' >> "$GITHUB_OUTPUT"
          echo "sync_branch=$sync_branch" >> "$GITHUB_OUTPUT"

      - name: Push Gitea sync branch
        if: ${{ steps.apply.outputs.has_changes == 'true' && steps.apply.outputs.needs_push == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/gitea-askpass" <<'EOF'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s' "$GITEA_USERNAME" ;;
            *) printf '%s' "$GITEA_TOKEN" ;;
          esac
          EOF
          chmod 700 "$RUNNER_TEMP/gitea-askpass"
          export GIT_ASKPASS="$RUNNER_TEMP/gitea-askpass"
          export GIT_TERMINAL_PROMPT=0
          git -C gitea-source push --quiet origin "HEAD:${{ steps.apply.outputs.sync_branch }}"
          rm -f "$RUNNER_TEMP/gitea-askpass"

      - name: Open Gitea pull request
        if: ${{ steps.apply.outputs.has_changes == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          api="$GITEA_BASE_URL/api/v1/repos/$GITEA_REPOSITORY"
          existing='[]'
          page=1
          while true; do
            pulls_page="$(curl --fail --silent --show-error \
              -H "Authorization: token $GITEA_TOKEN" \
              "$api/pulls?state=open&limit=50&page=$page")"
            jq -e 'type == "array"' >/dev/null <<<"$pulls_page" || {
              echo 'Gitea open PR list could not be parsed.' >&2
              exit 1
            }
            count="$(jq 'length' <<<"$pulls_page")"
            existing="$(jq -cn --argjson current "$existing" --argjson next "$pulls_page" '$current + $next')"
            [ "$count" -lt 50 ] && break
            page=$((page + 1))
          done
          source_title="$(jq -r '.title' "$RUNNER_TEMP/source-pr-metadata.json")"
          source_body="$(jq -r '.body' "$RUNNER_TEMP/source-pr-metadata.json")"
          body="$(jq -rn --arg source_body "$source_body" --arg url "$PUBLIC_PR_URL" \
            --arg sha "$PUBLIC_HEAD_SHA" \
            '$source_body + (if $source_body == "" then "" else "\n\n" end) + "来源 PR：" + $url + "\n来源提交：" + $sha')"
          if jq -e --arg branch "${{ steps.apply.outputs.sync_branch }}" \
            '.[] | select(.head.ref == $branch)' >/dev/null <<<"$existing"; then
            target_pr_number="$(jq -r --arg branch "${{ steps.apply.outputs.sync_branch }}" \
              '.[] | select(.head.ref == $branch) | .number' <<<"$existing" | head -n1)"
            payload="$(jq -n --arg title "$source_title" --arg body "$body" \
              '{title: $title, body: $body}')"
            curl --fail --silent --show-error --request PATCH \
              -H "Authorization: token $GITEA_TOKEN" \
              -H 'Content-Type: application/json' \
              --data "$payload" "$api/pulls/$target_pr_number" >/dev/null
          else
            payload="$(jq -n \
              --arg title "$source_title" \
              --arg head "${{ steps.apply.outputs.sync_branch }}" \
              --arg base "$GITEA_TARGET_BRANCH" \
              --arg body "$body" \
              '{title: $title, head: $head, base: $base, body: $body}')"
            created="$(curl --fail --silent --show-error --request POST \
              -H "Authorization: token $GITEA_TOKEN" \
              -H 'Content-Type: application/json' \
              --data "$payload" "$api/pulls")"
            target_pr_number="$(jq -r '.number' <<<"$created")"
          fi

  mirror-comment:
    needs: propose
    if: >-
      always() && github.repository == 'ChuqiCloud/AnyFlows' &&
      (needs.propose.result == 'success' || needs.propose.result == 'skipped') &&
      ((github.event_name == 'issue_comment' && github.event.issue.pull_request != null &&
        github.event.comment.user.type != 'Bot' &&
        !endsWith(github.event.comment.user.login, '[bot]')) ||
       (github.event_name == 'pull_request_target' && github.event.pull_request.merged == true))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GITEA_BASE_URL: https://gitea.acmecloud.cn
      GITEA_REPOSITORY: acmecloud/AnyFlows
      GITEA_SYNC_USERNAME: ${{ secrets.GITEA_SYNC_USERNAME }}
      GITEA_TOKEN: ${{ secrets.GITEA_SYNC_TOKEN }}
      GITHUB_TOKEN: ${{ github.token }}
      GITHUB_API_URL: ${{ github.api_url }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      PUBLIC_PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
    steps:
      - name: Check out trusted workflow revision
        uses: actions/checkout@v4
        with:
          # Both events resolve github.sha on the base/default branch.
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: tools/repository

      - name: Validate sync credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GITEA_SYNC_USERNAME" || { echo 'GITEA_SYNC_USERNAME is not configured' >&2; exit 1; }
          test -n "$GITEA_TOKEN" || { echo 'GITEA_SYNC_TOKEN is not configured' >&2; exit 1; }

      - name: Mirror public PR discussion to Gitea
        shell: bash
        run: python3 tools/repository/sync-github-pr-comments.py --pr "$PUBLIC_PR_NUMBER"
