<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="AnyFlows 大模型 API 中转与聚合网关控制台"
    />
    <title>AnyFlows 控制台</title>
    <meta name="theme-color" content="#07080a" />
    <script>
      // 首帧前落定主题类，避免深色站点闪白。深色是 AnyFlows 的正统形态，
      // 仅当系统明确偏好浅色且用户未手动选择时才走浅色。
      ;(function () {
        try {
          var stored = localStorage.getItem('anyflows.theme')
          var mode =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark'
          document.documentElement.classList.add(mode)

          // 动效开关同样要在首帧前落定，否则动画会先跑起来再被降级规则掐掉，出现一次闪动。
          // 默认尊重系统的「减少动态效果」；用户显式选择 full 时覆盖它。
          var motion = localStorage.getItem('anyflows.motion')
          if (motion === 'full' || motion === 'reduced') {
            document.documentElement.setAttribute('data-motion', motion)
          }
        } catch (error) {
          document.documentElement.classList.add('dark')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
