include:
  - .cnb/release.yml

.frontend-quality: &frontend-quality
  name: 前端质量门禁
  runner:
    tags: cnb:arch:amd64
    cpus: 64
  docker:
    image: node:24.15.0-bookworm-slim
    volumes:
      - web-pnpm-v10:/root/.local/share/pnpm/store:copy-on-write
  env:
    CI: "true"
  stages:
    - name: 安装前端依赖
      script: corepack pnpm@10.33.0 --dir web install --frozen-lockfile
    - name: 检查前端代码
      script: corepack pnpm@10.33.0 --dir web lint
    - name: 构建前端
      script: corepack pnpm@10.33.0 --dir web build

# 真实供应商门禁只由显式 API 事件触发，禁止进入普通 push/PR 流水线。
.live-provider-e2e-base: &live-provider-e2e-base
  runner:
    tags: cnb:arch:amd64
    cpus: 64
  sandbox: true
  lock:
    key: anyflows-live-provider-e2e
    wait: false
  docker:
    build:
      dockerfile: ./.cnb/ci.Dockerfile
      by:
        - ./.cnb/ci.Dockerfile
    volumes:
      - rust-cargo:/usr/local/cargo/registry:copy-on-write
      - rust-cargo:/usr/local/cargo/git:copy-on-write
      - rust-live-provider-1.97.1:./target:copy-on-write
  env:
    CARGO_TERM_COLOR: always
    RUST_BACKTRACE: "0"

"(master|develop)":
  push:
    - <<: *frontend-quality

    - name: Rust 质量门禁
      runner:
        tags: cnb:arch:amd64
        cpus: 64
      docker:
        build:
          dockerfile: ./.cnb/ci.Dockerfile
          by:
            - ./.cnb/ci.Dockerfile
        volumes:
          - rust-cargo:/usr/local/cargo/registry:copy-on-write
          - rust-cargo:/usr/local/cargo/git:copy-on-write
          - rust-advisories:/usr/local/cargo/advisory-dbs:copy-on-write
          - rust-quality-1.97.1:./target:copy-on-write
      env:
        CARGO_TERM_COLOR: always
        RUST_BACKTRACE: "1"
      stages:
        - name: 检查格式
          script: cargo fmt --all -- --check
        - name: 检查 crate 依赖边界
          script: cargo run --locked --package xtask -- check-deps
        - name: 测试发布脚本
          script: bash tools/ci/test-release-scripts.sh
        - name: 测试服务容器运行脚本
          script: bash tools/ci/test-container-test-runner.sh
        - name: 检查 OpenAPI 契约
          script: cargo run --locked --package xtask -- openapi check
        - name: 运行 Clippy
          script: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
        - name: 运行测试
          script: cargo nextest run --workspace --all-features --locked
        - name: 运行文档测试
          script: cargo test --workspace --all-features --doc --locked
        - name: 审计依赖
          script: cargo deny --all-features --locked check advisories bans licenses sources

    - name: 最低 Rust 版本
      runner:
        tags: cnb:arch:amd64
        cpus: 64
      docker:
        build:
          dockerfile: ./.cnb/ci.Dockerfile
          by:
            - ./.cnb/ci.Dockerfile
        volumes:
          - rust-cargo:/usr/local/cargo/registry:copy-on-write
          - rust-cargo:/usr/local/cargo/git:copy-on-write
          # MSRV 目标产物不跨构建复用，避免并发流水线留下缺失本地 crate 的陈旧元数据。
      env:
        CARGO_TERM_COLOR: always
        RUST_BACKTRACE: "1"
      stages:
        - name: 检查最低 Rust 版本
          script: cargo +1.95.0 check --workspace --all-targets --all-features --locked

    - name: SQLite 迁移冒烟
      runner:
        tags: cnb:arch:amd64
        cpus: 64
      docker:
        build:
          dockerfile: ./.cnb/ci.Dockerfile
          by:
            - ./.cnb/ci.Dockerfile
        volumes:
          - rust-cargo:/usr/local/cargo/registry:copy-on-write
          - rust-cargo:/usr/local/cargo/git:copy-on-write
          - rust-db-sqlite-1.97.1:./target:copy-on-write
      env:
        CARGO_TERM_COLOR: always
        RUST_BACKTRACE: "1"
      stages:
        - name: 运行 SQLite 迁移冒烟
          script: bash tools/ci/run-db-migration-test.sh sqlite

    - name: PostgreSQL 迁移冒烟
      runner:
        tags: cnb:arch:amd64
        cpus: 64
