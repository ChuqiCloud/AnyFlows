# CNB test pipelines are temporarily disabled while Gitea Actions runs the
# equivalent release, frontend, Rust, MSRV, database, and Redis checks.
# Restore the previous trigger configuration when CNB capacity is available.
__cnb_disabled__:
  push:
    - name: CNB pipelines disabled
      docker:
        image: alpine:3.22
      stages:
        - name: Skip CNB test pipelines
          script: echo "CNB test pipelines are temporarily disabled; use Gitea Actions."
