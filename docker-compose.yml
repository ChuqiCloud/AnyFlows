services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: anyflows:local
    # 当前服务明确拒绝非 loopback 监听；host 网络让反向代理仍可访问本机 8080。
    network_mode: host
    env_file:
      - .env
    environment:
      AF_SERVER__BIND: 127.0.0.1:8080
      AF_DATABASE__URL: postgres://anyflows:${POSTGRES_PASSWORD:?请先运行 scripts/deploy/init-env.sh}@127.0.0.1:5432/anyflows
      AF_REDIS__URL: redis://127.0.0.1:6379/
      AF_AUTH__SESSION_SIGNING_KEY: ${AF_AUTH__SESSION_SIGNING_KEY:?请先运行 scripts/deploy/init-env.sh}
      AF_CREDENTIAL_ENCRYPTION__KEY_ID: ${AF_CREDENTIAL_ENCRYPTION__KEY_ID:?请先运行 scripts/deploy/init-env.sh}
      AF_CREDENTIAL_ENCRYPTION__KEY: ${AF_CREDENTIAL_ENCRYPTION__KEY:?请先运行 scripts/deploy/init-env.sh}
      AF_BILLING__WAL_DIRECTORY: /app/data/billing-wal
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    volumes:
      - billing-wal:/app/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  postgres:
    image: postgres:17.10-bookworm@sha256:67870dc097790edf2bd6726658db995dcc830f799d41bb2b78ef07c9a2d5f010
    network_mode: host
    environment:
      POSTGRES_USER: anyflows
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请先运行 scripts/deploy/init-env.sh}
      POSTGRES_DB: anyflows
    command: ["postgres", "-c", "listen_addresses=127.0.0.1"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U anyflows -d anyflows"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:8.2.7-bookworm@sha256:d30960f73a599496d8b2802c97758bab6b1cd421fd06337f837779c47a57e1f3
    network_mode: host
    command: ["redis-server", "--bind", "127.0.0.1", "--protected-mode", "yes", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "-h", "127.0.0.1", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    volumes:
      - redis-data:/data

volumes:
  billing-wal:
  postgres-data:
  redis-data:
