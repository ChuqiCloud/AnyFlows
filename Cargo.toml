[workspace]
members = [
    "crates/af-account",
    "crates/af-adapter",
    "crates/af-admin",
    "crates/af-analytics",
    "crates/af-billing",
    "crates/af-cache",
    "crates/af-config",
    "crates/af-db",
    "crates/af-domain",
    "crates/af-http",
    "crates/af-httpclient",
    "crates/af-protocol",
    "crates/af-relay",
    "crates/af-scheduler",
    "crates/af-server",
    "crates/af-telemetry",
    "tools/xtask",
]
resolver = "3"

[workspace.package]
version = "0.2.0-beta.14"
edition = "2024"
rust-version = "1.95"
publish = false

[workspace.dependencies]
aho-corasick = { version = "1.1.4", default-features = false, features = ["std"] }
argon2 = { version = "0.5.3", default-features = false, features = ["alloc", "password-hash"] }
async-trait = "0.1.89"
aws-credential-types = "1.3.0"
aws-sigv4 = "1.5.1"
axum = { version = "0.8.9", default-features = false, features = [
    "http1",
    "json",
    "matched-path",
    "multipart",
    "tokio",
    "tracing",
] }
axum-server = "=0.8.0"
base64 = "0.22.1"
bytes = "1.11.1"
cargo_metadata = "0.23.1"
chacha20poly1305 = { version = "0.10.1", default-features = false, features = ["alloc"] }
dotenvy = "0.15.7"
figment = { version = "0.10.19", default-features = false, features = [
    "env",
    "toml",
] }
fs2 = "0.4.3"
futures-core = "0.3.32"
futures-util = "0.3.32"
getrandom = "0.4.3"
hickory-resolver = { version = "0.26.1", default-features = false, features = ["tokio"] }
hmac = "0.12.1"
http = "1.3.1"
include_dir = { version = "0.7.4", default-features = false }
insta = "1.43.2"
jsonwebtoken = { version = "11.0.0", default-features = false, features = [
    "rust_crypto",
    "use_pem",
] }
quick-xml = { version = "0.41.0", default-features = false }
lettre = { version = "0.11.22", default-features = false, features = [
    "builder",
    "smtp-transport",
    "tokio1-rustls-tls",
] }
lru = { version = "0.18.2", default-features = false }
metrics = "0.24.6"
metrics-exporter-prometheus = { version = "0.18.3", default-features = false }
mime_guess = "2.0.5"
md-5 = { version = "0.10.6", default-features = false }
percent-encoding = "2.3.2"
redis = { version = "1.4.1", default-features = false, features = [
    "connection-manager",
    "tokio-comp",
] }
regex = { version = "1.13.1", default-features = false, features = ["std"] }
rsa = { version = "0.9.10", default-features = false, features = ["pem", "sha2"] }
reqwest = { version = "0.13.4", default-features = false, features = [
    "http2",
    "rustls-no-provider",
    "socks",
    "stream",
] }
rhai = { version = "1.25.1", default-features = false, features = [
    "decimal",
    "internals",
    "no_closure",
    "no_custom_syntax",
    "no_float",
    "no_module",
    "std",
    "sync",
] }
rust_decimal = { version = "1.42.1", default-features = false }
rustls = { version = "0.23.45", default-features = false, features = [
    "ring",
    "std",
    "tls12",
] }
saml-rs = { version = "0.5.0", default-features = false, features = ["crypto-rustcrypto"] }
sea-orm = { version = "=1.1.20", default-features = false, features = [
    "macros",
    "runtime-tokio-rustls",
    "sqlx-mysql",
    "sqlx-postgres",
    "sqlx-sqlite",
    "with-json",
    "with-rust_decimal",
    "with-time",
] }
sea-orm-migration = { version = "=1.1.20", default-features = false, features = [
    "runtime-tokio-rustls",
    "sqlx-mysql",
    "sqlx-postgres",
    "sqlx-sqlite",
    "with-json",
    "with-rust_decimal",
    "with-time",
] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.150", features = ["raw_value"] }
sha1 = "0.10.7"
sha2 = { version = "0.10.9", default-features = false, features = ["oid"] }
# 仅启用转录输入与 Speech 输出所需的容器、AAC 及 FLAC 时长探测能力。
symphonia = { version = "0.5.5", default-features = false, features = [
    "aac",
    "flac",
    "isomp4",
    "mkv",
    "mp1",
    "mp2",
    "mp3",
    "ogg",
    "wav",
] }
thiserror = "2.0.18"
tiktoken-rs = { version = "0.12.0", default-features = false }
time = { version = "0.3.55", default-features = false, features = ["std", "parsing"] }
tokio = { version = "1.53.0", features = [
    "macros",
    "net",
    "io-util",
    "rt",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.0", default-features = false, features = [
    "cors",
    "limit",
    "trace",
] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = [
    "handshake",
] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
utoipa = { version = "5.5.0", features = ["preserve_order", "preserve_path_order"] }
url = "2.5.8"
uuid = { version = "1.24.0", default-features = false, features = ["std", "v4"] }
webauthn-rs = { version = "=0.5.2", default-features = false, features = ["danger-allow-state-serialisation", "danger-credential-internals"] }
zeroize = "1.9.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "deny"

[profile.release]
lto = "thin"
strip = "symbols"
