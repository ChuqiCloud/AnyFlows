[workspace]
members = [
    "crates/af-account",
    "crates/af-adapter",
    "crates/af-admin",
    "crates/af-analytics",
    "crates/af-billing",
    "crates/af-cache",
    "crates/af-config",
    "crates/af-db",
    "crates/af-domain",
    "crates/af-http",
    "crates/af-httpclient",
    "crates/af-protocol",
    "crates/af-relay",
    "crates/af-scheduler",
    "crates/af-server",
    "crates/af-telemetry",
    "tools/xtask",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[workspace.dependencies]
aho-corasick = { version = "1.1.4", default-features = false, features = ["std"] }
argon2 = { version = "0.5.3", default-features = false, features = ["alloc", "password-hash"] }
async-trait = "0.1.89"
axum = { version = "0.8.9", default-features = false, features = [
    "http1",
    "json",
    "matched-path",
    "tokio",
    "tracing",
] }
axum-server = "=0.8.0"
base64 = "0.22.1"
bytes = "1.11.1"
cargo_metadata = "0.23.1"
chacha20poly1305 = { version = "0.10.1", default-features = false, features = ["alloc"] }
figment = { version = "0.10.19", default-features = false, features = [
    "env",
    "toml",
] }
fs2 = "0.4.3"
futures-core = "0.3.32"
futures-util = "0.3.32"
getrandom = "0.4.3"
http = "1.3.1"
include_dir = { version = "0.7.4", default-features = false }
jsonwebtoken = { version = "11.0.0", default-features = false, features = ["rust_crypto"] }
lru = { version = "0.18.1", default-features = false }
metrics = "0.24.6"
metrics-exporter-prometheus = { version = "0.18.3", default-features = false }
mime_guess = "2.0.5"
redis = { version = "1.4.1", default-features = false, features = [
    "connection-manager",
    "tokio-comp",
] }
reqwest = { version = "0.13.4", default-features = false, features = [
    "http2",
    "rustls-no-provider",
    "socks",
    "stream",
] }
rust_decimal = { version = "1.42.1", default-features = false }
rustls = { version = "0.23.42", default-features = false, features = [
    "ring",
    "std",
    "tls12",
] }
sea-orm = { version = "=1.1.20", default-features = false, features = [
    "macros",
    "runtime-tokio-rustls",
    "sqlx-mysql",
    "sqlx-postgres",
    "sqlx-sqlite",
    "with-json",
    "with-rust_decimal",
    "with-time",
] }
sea-orm-migration = { version = "=1.1.20", default-features = false, features = [
    "runtime-tokio-rustls",
    "sqlx-mysql",
    "sqlx-postgres",
    "sqlx-sqlite",
    "with-json",
    "with-rust_decimal",
    "with-time",
] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = { version = "0.10.9", default-features = false }
thiserror = "2.0.18"
tiktoken-rs = { version = "0.12.0", default-features = false }
tokio = { version = "1.53.0", features = [
    "macros",
    "net",
    "io-util",
    "rt",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.0", default-features = false, features = [
    "cors",
    "limit",
    "trace",
] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
utoipa = { version = "5.5.0", features = ["preserve_order", "preserve_path_order"] }
url = "2.5.8"
uuid = { version = "1.24.0", default-features = false, features = ["std", "v4"] }
zeroize = "1.9.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "deny"

[profile.release]
lto = "thin"
strip = "symbols"
