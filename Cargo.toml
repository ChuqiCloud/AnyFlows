[workspace]
members = [
    "crates/af-account",
    "crates/af-adapter",
    "crates/af-admin",
    "crates/af-analytics",
    "crates/af-billing",
    "crates/af-cache",
    "crates/af-config",
    "crates/af-db",
    "crates/af-domain",
    "crates/af-http",
    "crates/af-httpclient",
    "crates/af-protocol",
    "crates/af-relay",
    "crates/af-scheduler",
    "crates/af-server",
    "crates/af-telemetry",
    "tools/xtask",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[workspace.dependencies]
cargo_metadata = "0.23.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "deny"

[profile.release]
lto = "thin"
strip = "symbols"
