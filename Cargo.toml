[workspace]
members = [
    "crates/af-account",
    "crates/af-adapter",
    "crates/af-admin",
    "crates/af-analytics",
    "crates/af-billing",
    "crates/af-cache",
    "crates/af-config",
    "crates/af-db",
    "crates/af-domain",
    "crates/af-http",
    "crates/af-httpclient",
    "crates/af-protocol",
    "crates/af-relay",
    "crates/af-scheduler",
    "crates/af-server",
    "crates/af-telemetry",
    "tools/xtask",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[workspace.dependencies]
argon2 = { version = "0.5.3", default-features = false, features = ["password-hash"] }
base64 = "0.22.1"
cargo_metadata = "0.23.1"
http = "1.3.1"
sea-orm = { version = "=1.1.20", default-features = false, features = [
    "macros",
    "runtime-tokio-rustls",
    "sqlx-mysql",
    "sqlx-postgres",
    "sqlx-sqlite",
    "with-json",
    "with-time",
] }
sea-orm-migration = { version = "=1.1.20", default-features = false, features = [
    "runtime-tokio-rustls",
    "sqlx-mysql",
    "sqlx-postgres",
    "sqlx-sqlite",
    "with-json",
    "with-time",
] }
thiserror = "2.0.18"
tokio = { version = "1.53.0", features = ["macros", "rt", "time"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
url = "2.5.8"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "deny"

[profile.release]
lto = "thin"
strip = "symbols"
