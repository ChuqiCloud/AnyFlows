# AnyFlows TOML 配置示例。
#
# 默认读取当前目录的 anyflows.conf；不存在时查找 anyflows.toml。
# 其他位置通过 AF_CONFIG_FILE 指定。进程环境变量覆盖文件配置；
# 当前目录的 .env 只补充未设置的环境变量。
# 生产部署需配置独立的 AF_AUTH__SESSION_SIGNING_KEY 和
# AF_CREDENTIAL_ENCRYPTION__KEY，替换下方开发示例值。
#
# 生成 32 字节 Base64URL 无填充密钥（Linux/macOS）：
#   openssl rand -base64 32 | tr '+/' '-_' | tr -d '='
# PowerShell（需安装 OpenSSL）：
#   (openssl rand -base64 32).Trim().Replace('+', '-').Replace('/', '_').TrimEnd('=')
#
# 含有实际凭据的配置仅保存在受限目录或密钥管理系统中。

[server]
# 只允许监听回环地址；外部访问通过反向代理提供。
bind = "127.0.0.1:8080"
cors_allowed_origins = []
client_ip_source = "peer"
trusted_proxy_cidrs = []
shutdown_timeout_secs = 30

[telemetry]
level = "info"

[database]
# 单机默认使用当前工作目录下的 SQLite；PostgreSQL/MySQL 请替换为对应 URL。
url = "sqlite://anyflows.db?mode=rwc"
migration_timeout_secs = 600
health_check_timeout_secs = 5

[billing]
batch_enabled = false
flush_interval_secs = 5
flush_timeout_secs = 30
usage_record_queue_capacity = 4096
usage_record_worker_count = 1
wal_directory = "data/billing-wal"

[image_storage]
directory = "data/images"

[subscription]
enabled = true
batch_size = 64
interval_secs = 60
max_batches_per_run = 8

[payment]
# Stripe 三项密钥按需配置；Epay 不需要自动退款密钥。
stripe_signature_tolerance_secs = 300
# stripe_secret_key = "sk_live_replace-me"
# stripe_publishable_key = "pk_live_replace-me"
# stripe_webhook_secret = "whsec_replace-me"

[credential_encryption]
# 仅供本地开发。生产环境使用独立密钥；已有数据须保留原加密密钥。
key_id = "local-development"
key = "5YBDWCM7kVDOuvgudCnRjIne3bMe5l2GhWllbaf7LXA"

[channel_probe]
enabled = false
batch_size = 16
interval_secs = 60
probe_timeout_secs = 10

[redis]
# Redis 用于多节点共享限流、调度状态及 OAuth 刷新租约等。
# url = "redis://127.0.0.1:6379/"
# request_rate_limit_namespace = "anyflows.gateway.rpm.v1"

[auth]
allow_query_api_key = false
lookup_timeout_secs = 2
# 仅供本地开发。生产环境使用独立密钥；更换后已有会话失效。
session_signing_key = "GUSFPXHFff1N4ujhsVvCC02xzv8SQ6j7w5NFyWi_Mwo"
session_ttl_secs = 3600

[turnstile]
# site_key 与 secret_key 必须成对配置；默认关闭。
timeout_secs = 5
# site_key = "replace-with-turnstile-site-key"
# secret_key = "replace-with-turnstile-secret-key"

[oauth]
max_pending_authorizations = 256
session_ttl_secs = 600
refresh_enabled = true
refresh_interval_secs = 60
refresh_before_expiry_secs = 300
refresh_batch_size = 64
refresh_concurrency = 8
# [oauth.claude_code]
# client_id = "replace-with-client-id"
# OpenAI Codex OAuth 使用内置客户端，不需要单独配置 OAuth Provider。
# [oauth.gemini]
# client_id = "replace-with-client-id"
# client_secret = "replace-with-client-secret"
# [oauth.antigravity]
# client_id = "replace-with-client-id"
# client_secret = "replace-with-client-secret"

[http_client]
max_cached_clients = 128
connect_timeout_secs = 5
read_timeout_secs = 300
request_timeout_secs = 900
trust_proxy_dns = false
# proxy_url = "socks5://127.0.0.1:10808"

# 模型请求使用数据库渠道；以下为旧版嵌入式静态上游兼容配置。
# [openai_upstream]
# base_url = "https://upstream.example"
# model = "replace-with-model-name"
# api_key = "replace-with-upstream-key"

